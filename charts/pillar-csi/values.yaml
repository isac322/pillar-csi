# Default values for pillar-csi.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# -- Global image pull policy applied to all containers unless overridden per component.
imagePullPolicy: IfNotPresent

# -- Optional list of imagePullSecrets applied to all Pods.
imagePullSecrets: []
# - name: my-registry-secret

# -- Install CRDs as part of the Helm release. Set to false when managing CRDs separately
# (e.g. via GitOps or a dedicated CRD chart). CRDs are annotated with
# helm.sh/resource-policy: keep so they are never deleted on chart uninstall.
installCRDs: true

# -- Namespace override. Defaults to the Helm release namespace.
namespaceOverride: ""

# -- Full name override for resource naming.
fullnameOverride: ""

# -- Name override (replaces the chart name portion of generated names).
nameOverride: ""

# ─── pillar-controller ───────────────────────────────────────────────────────
# Kubernetes Deployment: CRD reconciler + CSI Controller service.
# Runs CSI sidecars: provisioner, attacher, resizer, liveness-probe.
controller:
  # -- Number of controller replicas. >1 is safe: every replica serves the
  # pod-local CSI socket so its sidecars stay healthy, while the manager and
  # the CSI sidecars hold independent leader-election leases. Pair with
  # controller.affinity podAntiAffinity so replicas land on different nodes.
  replicaCount: 1

  image:
    # -- Container image repository for the controller (manager) binary.
    repository: ghcr.io/isac322/pillar-csi/controller
    # -- Image tag. Defaults to the chart's appVersion when empty.
    tag: ""
    # -- Per-container image pull policy override.
    pullPolicy: ""

  # -- Extra command-line arguments appended to the manager entrypoint.
  extraArgs: []
  # - --zap-log-level=debug

  # -- Additional environment variables injected into the manager container.
  extraEnv: []
  # - name: MY_VAR
  #   value: "value"

  # -- Resource requests/limits for the manager container.
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

  # -- Node selector applied to the controller Pod.
  nodeSelector: {}

  # -- Tolerations applied to the controller Pod.
  tolerations: []

  # -- Affinity rules for the controller Pod.
  affinity: {}

  # -- Annotations added to the controller Deployment.
  annotations: {}

  # -- Annotations added to the controller Pod template.
  podAnnotations: {}

  # -- Labels added to the controller Pod template.
  podLabels: {}

  # CSI sidecar containers bundled with the controller.
  sidecars:
    provisioner:
      image:
        # -- csi-provisioner image repository.
        repository: registry.k8s.io/sig-storage/csi-provisioner
        # -- csi-provisioner image tag.
        tag: "v6.3.0"
        pullPolicy: ""
      # -- Resource requests/limits for the provisioner sidecar.
      resources:
        limits:
          cpu: 100m
          memory: 64Mi
        requests:
          cpu: 10m
          memory: 32Mi
      # -- Extra arguments for csi-provisioner. `--extra-create-metadata` is
      # always passed: CreateVolume reads the PVC override annotations through it.
      extraArgs: []

    attacher:
      image:
        # -- csi-attacher image repository.
        repository: registry.k8s.io/sig-storage/csi-attacher
        # -- csi-attacher image tag.
        tag: "v4.12.0"
        pullPolicy: ""
      # -- Resource requests/limits for the attacher sidecar.
      resources:
        limits:
          cpu: 100m
          memory: 64Mi
        requests:
          cpu: 10m
          memory: 32Mi
      # -- Extra arguments for csi-attacher.
      extraArgs: []

    resizer:
      image:
        # -- csi-resizer image repository.
        repository: registry.k8s.io/sig-storage/csi-resizer
        # -- csi-resizer image tag.
        tag: "v2.2.1"
        pullPolicy: ""
      # -- Resource requests/limits for the resizer sidecar.
      resources:
        limits:
          cpu: 100m
          memory: 64Mi
        requests:
          cpu: 10m
          memory: 32Mi
      # -- Extra arguments for csi-resizer.
      extraArgs: []

    livenessProbe:
      image:
        # -- livenessprobe image repository.
        repository: registry.k8s.io/sig-storage/livenessprobe
        # -- livenessprobe image tag (shared with node liveness sidecar).
        tag: "v2.19.0"
        pullPolicy: ""
      # -- Resource requests/limits for the liveness-probe sidecar.
      resources:
        limits:
          cpu: 50m
          memory: 32Mi
        requests:
          cpu: 5m
          memory: 16Mi

  # -- HTTP port exposed by the manager health-probe endpoint.
  healthProbePort: 8081

  # -- Metrics port exposed by the manager.
  metricsPort: 8080

  # -- HTTP port exposed by the liveness-probe sidecar for CSI socket health checks.
  livenessPort: 9809

  # -- CSI Unix socket path on the shared emptyDir volume.
  csiSocketPath: /csi/csi.sock

# ─── Admission webhooks ──────────────────────────────────────────────────────
# The controller registers validation/defaulting handlers for the pillar CRDs.
# The chart creates a release-scoped Service, self-signed serving certificate,
# and the corresponding admissionregistration resources by default.
webhook:
  # -- Enable admission validation and defaulting webhooks.
  enabled: true
  # -- HTTPS port served by controller-runtime inside the controller Pod.
  port: 9443
  # -- Directory where the generated serving certificate is mounted.
  certDir: /tmp/k8s-webhook-server/serving-certs


# ─── pillar-node ─────────────────────────────────────────────────────────────
# Kubernetes DaemonSet: CSI Node service + NVMe-oF/TCP initiator.
# Runs CSI sidecars: node-driver-registrar, liveness-probe.
# Init container: best-effort modprobe for initiator kernel modules.
node:
  image:
    # -- Container image repository for the pillar-node binary.
    repository: ghcr.io/isac322/pillar-csi/node
    # -- Image tag. Defaults to the chart's appVersion when empty.
    tag: ""
    # -- Per-container image pull policy override.
    pullPolicy: ""

  # -- Extra command-line arguments appended to the pillar-node entrypoint.
  extraArgs: []

  # -- Additional environment variables injected into the node container.
  extraEnv: []

  # -- Resource requests/limits for the pillar-node container.
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 64Mi

  # -- Node selector applied to node DaemonSet Pods.
  # By default runs on all worker nodes.
  nodeSelector: {}

  # -- Tolerations applied to node DaemonSet Pods.
  tolerations: []

  # -- Annotations added to the node DaemonSet.
  annotations: {}

  # -- Annotations added to the node Pod template.
  podAnnotations: {}

  # -- Labels added to the node Pod template.
  podLabels: {}

  # -- Host path for the kubelet plugin registration directory.
  kubeletPluginsDir: /var/lib/kubelet/plugins

  # -- Host path for the kubelet plugin registration socket directory.
  kubeletPluginRegistrationDir: /var/lib/kubelet/plugins_registry

  # -- CSI Unix socket path on the node host.
  csiSocketPath: /var/lib/kubelet/plugins/pillar-csi.bhyoo.com/csi.sock

  # -- Liveness probe HTTP port exposed by the node liveness sidecar (hostPort NOT used).
  livenessPort: 9808

  # -- Run the node Pod in the host network namespace.  Required because
  # `nvme connect` writes to /dev/nvme-fabrics issue TCP SYNs from the
  # caller's netns; with hostNetwork: false the SYNs originate in the pod
  # netns and cannot reach the host-network nvmet listener exposed by the
  # agent.  See PRD §2.4 for the kernel netns rationale.
  hostNetwork: true

  # Init container that runs modprobe for initiator kernel modules (best-effort).
  # Pod startup is NOT blocked if modprobe fails.
  initModprobe:
    image:
      # -- Image used for the modprobe init container (needs kmod/modprobe binary).
      repository: busybox
      # -- Init container image tag.
      tag: "1.38.0"
      pullPolicy: ""
    # -- Kernel modules to load. Failures are silently ignored (best-effort).
    # nvme_fabrics must be listed before nvme_tcp (it is a dependency).
    # dm_mod provides the device-mapper target that holds the backend device
    # of a local attach on the storage node.
    modules:
      - nvme_fabrics
      - nvme_tcp
      - dm_mod
    # -- Resource requests/limits for the modprobe init container.
    resources:
      limits:
        cpu: 50m
        memory: 32Mi
      requests:
        cpu: 5m
        memory: 16Mi

  sidecars:
    nodeDriverRegistrar:
      image:
        # -- csi-node-driver-registrar image repository.
        repository: registry.k8s.io/sig-storage/csi-node-driver-registrar
        # -- csi-node-driver-registrar image tag.
        tag: "v2.17.0"
        pullPolicy: ""
      # -- Resource requests/limits for the node-driver-registrar sidecar.
      resources:
        limits:
          cpu: 100m
          memory: 64Mi
        requests:
          cpu: 10m
          memory: 32Mi
      # -- Extra arguments for csi-node-driver-registrar.
      extraArgs: []

    livenessProbe:
      image:
        # -- livenessprobe image repository (can differ from controller's).
        repository: registry.k8s.io/sig-storage/livenessprobe
        # -- livenessprobe image tag.
        tag: "v2.19.0"
        pullPolicy: ""
      # -- Resource requests/limits for the liveness-probe sidecar.
      resources:
        limits:
          cpu: 50m
          memory: 32Mi
        requests:
          cpu: 5m
          memory: 16Mi

# ─── pillar-agent ────────────────────────────────────────────────────────────
# Kubernetes DaemonSet: gRPC agent on storage nodes.
# Scheduled only on nodes labelled pillar-csi.bhyoo.com/agent-node=true
# (the controller manages this label automatically via PillarAgent CRs).
# hostNetwork defaults to true so that nvmet_tcp listeners and `nvme connect`
# TCP sockets are created in the host network namespace.  Disabling this
# breaks the NVMe-oF data plane in every clustered deployment; see
# PRD §2.4 for the kernel netns rationale.
# Init container: best-effort modprobe for target kernel modules.
agent:
  image:
    # -- Container image repository for the pillar-agent binary.
    repository: ghcr.io/isac322/pillar-csi/agent
    # -- Image tag. Defaults to the chart's appVersion when empty.
    tag: ""
    # -- Per-container image pull policy override.
    pullPolicy: ""

  # -- Backend placement config for the pillar-agent.  The list is rendered
  # verbatim into the `backends:` list of the agent config file (ConfigMap
  # <fullname>-agent-config, passed to the agent via --config).  Each entry
  # sets exactly one of `zfs` or `lvm`, with the same keys as the placement
  # fields of PillarStore.spec.backend:
  #   - zfs: `pool` is required; `volumeType` (only `zvol`, the default) and
  #          `parentDataset` are optional.  `properties` is refused: ZFS
  #          properties are per-volume settings of the PillarStore,
  #          PillarStorageClass overrides or PVC backend document.
  #   - lvm: `volumeGroup` is required; `thinPool` (thin pool LV used by
  #          thin volumes) and `provisioningMode` (`linear` default | `thin`;
  #          the mode for agent requests that name none — CSI always names
  #          the resolved mode) are optional.
  # The agent rejects unknown keys with their path and exits with an error
  # when no backend is configured.  An entry setting neither or both of
  # zfs/lvm fails the chart render.
  # Each ZFS `pool` and LVM `volumeGroup` may appear in at most one entry (a
  # ZFS pool and an LVM VG must not share a name either): volumes are routed
  # to a backend by pool/VG name alone, so a duplicate fails the chart render
  # and the agent refuses to start when given one.
  # `parentDataset` and `thinPool` decide where volumes are created and must
  # equal the PillarStore's spec.backend.zfs.parentDataset /
  # spec.backend.lvm.thinPool for that pool/VG (omitted = pool root / no thin
  # pool).  On a mismatch the PillarStore is not Ready (PoolDiscovered=False,
  # BackendLayoutMismatch) and CreateVolume fails; volumes are never placed
  # elsewhere.
  #
  # Example:
  #   backends:
  #     - zfs:
  #         pool: tank
  #     - zfs:
  #         volumeType: zvol
  #         pool: hot-data
  #         parentDataset: k8s
  #     - lvm:
  #         volumeGroup: data-vg
  #         thinPool: thin0
  #         provisioningMode: linear
  backends: []

  # -- Extra command-line arguments appended to the pillar-agent entrypoint.
  extraArgs: []

  # -- Additional environment variables injected into the agent container.
  extraEnv: []

  # -- Run the agent container in privileged mode (default: true).
  # The storage backends open host device nodes directly: LVM needs
  # /dev/mapper/control and every PV block device (and dm-N nodes created at
  # runtime by lvcreate); ZFS needs /dev/zfs. For a non-privileged container the
  # container runtime installs the default OCI device cgroup allowlist (on cgroup
  # v2 an eBPF device filter), which rejects open() on these nodes with EPERM even
  # for runAsUser=0 + CAP_SYS_ADMIN and a hostPath /dev mount — capabilities
  # cannot bypass the device cgroup. The agent then cannot query pool capacity,
  # reports degraded health and no discovered pools, and PillarStores never
  # become Ready. This applies to bare-metal nodes as well as Kind/nested setups.
  # Set to false only when the deployment authorizes those host devices for the
  # agent container by other means (e.g. runtime device-cgroup configuration or a
  # device plugin/CDI covering every required device).
  privileged: true

  # -- Resource requests/limits for the pillar-agent container.
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 64Mi

  # -- Node selector applied to agent DaemonSet Pods.
  # The controller automatically adds pillar-csi.bhyoo.com/agent-node=true
  # to nodes referenced by PillarAgent CRs; this selector ensures the agent
  # runs only on those nodes.
  nodeSelector:
    pillar-csi.bhyoo.com/agent-node: "true"

  # -- Tolerations applied to agent DaemonSet Pods.
  tolerations: []

  # -- Annotations added to the agent DaemonSet.
  annotations: {}

  # -- Annotations added to the agent Pod template.
  podAnnotations: {}

  # -- Labels added to the agent Pod template.
  podLabels: {}

  # -- Run the agent Pod in the host network namespace.  Required for the
  # NVMe-oF data plane (see PRD §2.4).  Set to false only for isolated
  # gRPC-only deployments where no kernel target is exported (e.g. unit-test
  # harnesses); production NVMe-oF exports will fail with
  # "connection refused" at NodeStageVolume when this is false.
  hostNetwork: true

  # -- gRPC listen port inside the container (also exposed as hostPort).
  grpcPort: 9500

  # -- hostPort number bound on the node IP for agent gRPC access.
  # Must match grpcPort. Set to 0 to disable hostPort (not recommended).
  hostPort: 9500

  # Init container that runs modprobe for target kernel modules (best-effort).
  # Pod startup is NOT blocked if modprobe fails — failed modules are excluded
  # from agent capabilities and reflected in PillarAgent status conditions.
  initModprobe:
    image:
      # -- Image used for the modprobe init container (needs kmod/modprobe binary).
      repository: busybox
      # -- Init container image tag.
      tag: "1.38.0"
      pullPolicy: ""
    # -- Kernel modules to load. Failures are silently ignored (best-effort).
    # nvmet must be listed before nvmet_tcp (it is a dependency).
    modules:
      - nvmet
      - nvmet_tcp
    # -- Resource requests/limits for the modprobe init container.
    resources:
      limits:
        cpu: 50m
        memory: 32Mi
      requests:
        cpu: 5m
        memory: 16Mi

# ─── RBAC ────────────────────────────────────────────────────────────────────
rbac:
  # -- Set to false to skip ClusterRole/ClusterRoleBinding creation.
  create: true

# ─── Service Accounts ────────────────────────────────────────────────────────
serviceAccount:
  controller:
    # -- Set to false to skip ServiceAccount creation for the controller.
    create: true
    # -- Override the ServiceAccount name. Defaults to <fullname>-controller.
    name: ""
    # -- Annotations added to the controller ServiceAccount (e.g. for IRSA/Workload Identity).
    annotations: {}

  node:
    # -- Set to false to skip ServiceAccount creation for pillar-node.
    create: true
    # -- Override the ServiceAccount name. Defaults to <fullname>-node.
    name: ""
    # -- Annotations added to the node ServiceAccount.
    annotations: {}

  agent:
    # -- Set to false to skip ServiceAccount creation for pillar-agent.
    create: true
    # -- Override the ServiceAccount name. Defaults to <fullname>-agent.
    name: ""
    # -- Annotations added to the agent ServiceAccount.
    annotations: {}

# ─── CSI Driver ──────────────────────────────────────────────────────────────
csiDriver:
  # -- Set to false to skip CSIDriver object creation.
  create: true
  # -- Indicates this CSI driver requires an attach operation (ControllerPublishVolume).
  attachRequired: true
  # -- Inject Pod info (name/namespace/UID) as volume attributes on mount.
  podInfoOnMount: true
  # -- fsGroupPolicy for the CSIDriver. Valid values: None, File, ReadWriteOnceWithFSType.
  fsGroupPolicy: File
  # -- volumeLifecycleModes supported by the driver.
  volumeLifecycleModes:
    - Persistent

# ─── Metrics / Monitoring ─────────────────────────────────────────────────────
metrics:
  # -- Serve pillar-agent and pillar-node /metrics and the CSI sidecars' --http-endpoint.
  # The controller endpoint (controller.metricsPort) is always served.
  enabled: false
  controller:
    # -- HTTPS + TokenReview/SubjectAccessReview on the controller endpoint (binary default).
    # false passes --metrics-secure=false (plain HTTP).
    secure: true
  agent:
    # -- pillar-agent /metrics port. Bound to the host IP when agent.hostNetwork is true.
    port: 9501
  node:
    # -- pillar-node /metrics port. Bound to the host IP when node.hostNetwork is true.
    port: 9502
  sidecars:
    # -- csi-provisioner --http-endpoint port (container port `provisioner-metrics`).
    provisionerPort: 8090
    # -- csi-attacher --http-endpoint port (container port `attacher-metrics`).
    attacherPort: 8091
    # -- csi-resizer --http-endpoint port (container port `resizer-metrics`).
    resizerPort: 8092
  podMonitor:
    # -- Render prometheus-operator PodMonitors (requires monitoring.coreos.com/v1).
    enabled: false
    # -- Scrape interval override. Defaults to the Prometheus global scrape interval.
    interval: ""
    # -- Scrape timeout override. Defaults to the Prometheus global scrape timeout.
    scrapeTimeout: ""
    # -- Additional labels added to every PodMonitor (e.g. the Prometheus podMonitorSelector).
    labels: {}

# ─── Tracing ─────────────────────────────────────────────────────────────────
tracing:
  # -- Render OTEL_* env into controller, agent and node. The binaries trace only when an OTLP endpoint is set.
  enabled: false
  # -- OTLP/gRPC endpoint, e.g. http://tempo-distributor.monitoring:4317 or http://$(HOST_IP):4317
  # for a node-local collector (hostNetwork pods keep cluster DNS through ClusterFirstWithHostNet).
  # Required when tracing.enabled is true.
  endpoint: ""
  # -- OTEL_EXPORTER_OTLP_INSECURE: dial the OTLP endpoint without TLS.
  insecure: true
  # -- OTEL_TRACES_SAMPLER_ARG for the pillar root sampler (parent-based; parentless client spans always dropped).
  samplerRatio: "1.0"

# ─── mTLS between controller and agent ────────────────────────────────────────
# Phase 1 PRD allows plaintext gRPC by default; mTLS is opt-in.
# The certificate chain (tls.crt, tls.key, ca.crt) is sourced either from
# pre-existing Secrets (mode=secret) or generated by cert-manager
# (certManager.enabled=true, requires cert-manager installed in the cluster).
mtls:
  # -- Enable mTLS for controller ↔ agent gRPC traffic. When false the
  # controller dials the agent with plaintext credentials.
  enabled: false

  # -- Path inside controller and agent containers where the cert Secret is
  # mounted. Templates expose this via the pillar-csi.mtls.certDir helper.
  certDir: /etc/pillar-csi/mtls

  certManager:
    # -- If true the chart renders a cert-manager Issuer plus two Certificate
    # resources that produce Secrets named "<fullname>-controller-mtls" and
    # "<fullname>-agent-mtls". Requires cert-manager CRDs in the cluster.
    enabled: false
    # -- Override the IssuerRef. When name is empty the chart creates a
    # self-signed Issuer in the release namespace.
    issuerRef:
      name: ""
      kind: Issuer
      group: cert-manager.io
    # -- Certificate lifetime; cert-manager renews "renewBefore" the expiry.
    duration: 2160h     # 90d
    renewBefore: 360h   # 15d

  # -- When certManager.enabled is false the chart mounts pre-existing
  # Secrets. The operator MUST create these Secrets in the release namespace
  # with keys tls.crt, tls.key, ca.crt before installing.
  secretRefs:
    controller:
      secretName: pillar-controller-mtls
    agent:
      secretName: pillar-agent-mtls

  # -- Override the TLS server name the controller uses when verifying the
  # agent's certificate (SNI / SAN match). Required when the agent
  # certificate is issued against a DNS name (cert-manager auto-issuance
  # always does so) instead of the per-node IP the controller dials.
  # Leave empty to let cert-manager mode auto-derive it as
  # "<fullname>-agent.<namespace>.svc"; the operator must set it when
  # providing custom Secrets whose agent cert SAN differs from the node IP.
  serverName: ""
