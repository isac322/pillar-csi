{{/*
Metrics reader identity for the controller PodMonitor.  With
metrics.controller.secure the controller's /metrics endpoint accepts only
bearer tokens whose subject may "get" the /metrics non-resource URL
(TokenReview + SubjectAccessReview).  The chart creates a dedicated
ServiceAccount with a long-lived token Secret that the PodMonitor references,
so Prometheus needs no RBAC of its own for this endpoint.
The ClusterRole and ClusterRoleBinding honour rbac.create.
*/}}
{{- if and .Values.metrics.podMonitor.enabled .Values.metrics.controller.secure }}
{{- $name := include "pillar-csi.metricsReaderName" . }}
{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
  labels:
    {{- include "pillar-csi.componentLabels" (dict "root" . "component" "controller") | nindent 4 }}
rules:
  - nonResourceURLs:
      - /metrics
    verbs:
      - get
---
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ include "pillar-csi.namespace" . }}
  labels:
    {{- include "pillar-csi.componentLabels" (dict "root" . "component" "controller") | nindent 4 }}
---
apiVersion: v1
kind: Secret
type: kubernetes.io/service-account-token
metadata:
  name: {{ $name }}-token
  namespace: {{ include "pillar-csi.namespace" . }}
  labels:
    {{- include "pillar-csi.componentLabels" (dict "root" . "component" "controller") | nindent 4 }}
  annotations:
    kubernetes.io/service-account.name: {{ $name }}
{{- if .Values.rbac.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "pillar-csi.componentLabels" (dict "root" . "component" "controller") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ include "pillar-csi.namespace" . }}
{{- end }}
{{- end }}
