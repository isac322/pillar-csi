apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "pillar-csi.fullname" . }}-agent
  namespace: {{ include "pillar-csi.namespace" . }}
  labels:
    {{- include "pillar-csi.componentLabels" (dict "root" . "component" "agent") | nindent 4 }}
  {{- with .Values.agent.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "pillar-csi.componentSelectorLabels" (dict "root" . "component" "agent") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pillar-csi.componentSelectorLabels" (dict "root" . "component" "agent") | nindent 8 }}
        {{- with .Values.agent.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # Roll the agent pods when the rendered backend config changes: the
        # agent reads its config file only at startup.
        checksum/agent-config: {{ include "pillar-csi.agent.config" . | sha256sum }}
        {{- with .Values.agent.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      # hostNetwork: true is required for the NVMe-oF and iSCSI data planes.
      # The kernel binds nvmet_tcp (and LIO iscsi_target_mod network portal)
      # listening sockets in the netns of the process that writes configfs
      # (the agent).  With hostNetwork: false those listeners live in the pod
      # netns and are unreachable from the host network where initiators
      # connect.  See PRD §2.4 for the full rationale and operator override.
      hostNetwork: {{ .Values.agent.hostNetwork }}
      {{- if .Values.agent.hostNetwork }}
      # When hostNetwork is true the pod uses the host's DNS resolver by
      # default, which can break in-cluster service lookups (kube-dns).
      # ClusterFirstWithHostNet keeps cluster DNS available.
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "pillar-csi.agentServiceAccountName" . }}
      # terminationGracePeriodSeconds is the upper bound for the whole shutdown
      # sequence: kubelet sends SIGTERM → preStop (5s wait for the endpoint
      # controller to propagate readiness=false) → the binary's SIGTERM handler
      # flips gRPC health to NOT_SERVING, runs Drain (waits for in-flight
      # per-target operations to release their locks), waits the configured
      # --shutdown-grace-period, then GracefulStop completes any remaining
      # accepted RPCs.  60s gives the slowest path (drain + grace + RPC tail)
      # comfortable headroom on a busy node without blocking node drain forever.
      terminationGracePeriodSeconds: 60
      # ── Init containers ────────────────────────────────────────────────────
      # Loads target kernel modules. Failures are silently ignored (best-effort):
      # the pod does NOT fail to start if a module cannot be loaded.
      initContainers:
        - name: modprobe
          image: {{ include "pillar-csi.image" (dict "image" .Values.agent.initModprobe.image "defaultTag" .Values.agent.initModprobe.image.tag) }}
          imagePullPolicy: {{ include "pillar-csi.imagePullPolicy" (dict "image" .Values.agent.initModprobe.image "global" .Values.imagePullPolicy) }}
          # Run modprobe for each module; || true ensures the init container
          # always exits 0 so the pod is not blocked on module-load failure.
          command:
            - /bin/sh
            - -c
            - |
              {{- range .Values.agent.initModprobe.modules }}
              modprobe {{ . }} || true
              {{- end }}
          securityContext:
            privileged: true
          volumeMounts:
            - name: lib-modules
              mountPath: /lib/modules
              readOnly: true
          resources:
            {{- toYaml .Values.agent.initModprobe.resources | nindent 12 }}
      # ── Main containers ────────────────────────────────────────────────────
      containers:
        - name: agent
          image: {{ include "pillar-csi.image" (dict "image" .Values.agent.image "defaultTag" .Chart.AppVersion) }}
          imagePullPolicy: {{ include "pillar-csi.imagePullPolicy" (dict "image" .Values.agent.image "global" .Values.imagePullPolicy) }}
          ports:
            - name: grpc
              containerPort: {{ .Values.agent.grpcPort }}
              # hostPort is kept for explicit node-IP exposure even though
              # hostNetwork: true already binds the listener on every host
              # interface; it lets the chart consumer point a Service /
              # firewall rule at a stable port rather than introspecting
              # the agent container's listen address (PRD §2.4).
              {{- if .Values.agent.hostPort }}
              hostPort: {{ .Values.agent.hostPort }}
              {{- end }}
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.agent.port }}
              protocol: TCP
            {{- end }}
          securityContext:
            # CAP_SYS_ADMIN is required for NVMe-oF and iSCSI (LIO) target management
            # (configfs writes, block device operations).
            # runAsUser 0 overrides the Dockerfile USER directive because ZFS and
            # configfs operations require root.
            runAsUser: 0
            capabilities:
              add:
                - SYS_ADMIN
            # privileged defaults to true (agent.privileged): without it the
            # container runtime's default device cgroup allowlist rejects open()
            # on host device nodes (/dev/mapper/control, PV block devices,
            # /dev/zfs) with EPERM even for root+SYS_ADMIN, so backend discovery
            # fails. An explicit false is honoured for deployments that authorize
            # those devices by other means; a non-boolean value fails the render
            # instead of silently dropping privilege.
            {{- if not (kindIs "bool" .Values.agent.privileged) }}
            {{- fail "agent.privileged must be a boolean (true or false)" }}
            {{- end }}
            privileged: {{ .Values.agent.privileged }}
            allowPrivilegeEscalation: true
          args:
            - --listen-address=:{{ .Values.agent.grpcPort }}
            - --config={{ include "pillar-csi.agent.configPath" . }}
            {{- if .Values.mtls.enabled }}
            - --tls-cert={{ include "pillar-csi.mtls.certDir" . }}/tls.crt
            - --tls-key={{ include "pillar-csi.mtls.certDir" . }}/tls.key
            - --tls-ca={{ include "pillar-csi.mtls.certDir" . }}/ca.crt
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - --metrics-bind-address={{ include "pillar-csi.metricsBindAddress" (dict "hostNetwork" .Values.agent.hostNetwork "port" .Values.metrics.agent.port) }}
            {{- end }}
            {{- range .Values.agent.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if or .Values.metrics.enabled .Values.tracing.enabled }}
            {{- include "pillar-csi.telemetryPodEnv" . | trim | nindent 12 }}
            {{- end }}
            {{- if .Values.tracing.enabled }}
            {{- include "pillar-csi.otelEnv" . | trim | nindent 12 }}
            {{- end }}
            {{- with .Values.agent.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # In plaintext mode, native gRPC probes read the standard
          # grpc.health.v1 Health service on the agent port. With mTLS enabled,
          # the probes switch to TCP because kubelet cannot present a client
          # certificate. Kubelet flips the pod out of Service endpoints as
          # soon as readiness fails, which is what preStop waits 5s for before
          # the binary's SIGTERM Drain runs.
          livenessProbe:
            {{ if .Values.mtls.enabled }}
            # Kubelet gRPC probes are plaintext and cannot authenticate to the
            # mTLS listener. TCP probes validate that the TLS listener is
            # accepting connections without weakening the API's TLS policy.
            tcpSocket:
              port: {{ .Values.agent.grpcPort }}
            {{ else }}
            grpc:
              port: {{ .Values.agent.grpcPort }}
            {{ end }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            {{ if .Values.mtls.enabled }}
            tcpSocket:
              port: {{ .Values.agent.grpcPort }}
            {{ else }}
            grpc:
              port: {{ .Values.agent.grpcPort }}
            {{ end }}
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          # preStop gives the endpoint controller time to propagate
          # readiness=false (and route new traffic away) BEFORE SIGTERM
          # triggers Drain in the binary.  Drain itself only blocks until
          # in-flight per-target ops release; the 5s here is purely the
          # routing-propagation budget.
          #
          # The runtime image strips /bin/sh /bin/bash /usr/bin/env for
          # supply-chain hygiene (see Dockerfile agent stage); /bin/busybox
          # is the only interpreter that ships in the image, so the
          # preStop command must invoke busybox directly instead of via a
          # shell.
          lifecycle:
            preStop:
              exec:
                command: ["/bin/busybox", "sleep", "5"]
          volumeMounts:
            # configfs — required for NVMe-oF (nvmet) and iSCSI (LIO) target configuration.
            - name: sys-kernel-config
              mountPath: /sys/kernel/config
            # /dev — required for block device operations (target backstores).
            - name: dev
              mountPath: /dev
            # Agent state dir — durable per-volume fencing generations and the
            # Drain marker.  Must survive pod restarts and node reboots, so it
            # is a hostPath on the storage node's own disk (never a PVC: the
            # agent must not depend on volumes it serves).
            - name: agent-state
              mountPath: /var/lib/pillar-csi/agent
            # Backend placement config rendered from agent.backends.
            - name: agent-config
              mountPath: {{ include "pillar-csi.agent.configDir" . }}
              readOnly: true
            {{- if .Values.mtls.enabled }}
            - name: mtls-certs
              mountPath: {{ include "pillar-csi.mtls.certDir" . }}
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
      # ── Volumes ────────────────────────────────────────────────────────────
      volumes:
        # /sys/kernel/config — configfs filesystem for nvmet and LIO target management.
        - name: sys-kernel-config
          hostPath:
            path: /sys/kernel/config
            type: DirectoryOrCreate
        # /dev — block device nodes needed for target backstores.
        - name: dev
          hostPath:
            path: /dev
            type: Directory
        # Durable agent state (fencing generations); see the volumeMount.
        - name: agent-state
          hostPath:
            path: /var/lib/pillar-csi/agent
            type: DirectoryOrCreate
        # /lib/modules — read-only access for the modprobe init container.
        - name: lib-modules
          hostPath:
            path: /lib/modules
            type: Directory
        - name: agent-config
          configMap:
            name: {{ include "pillar-csi.fullname" . }}-agent-config
        {{- if .Values.mtls.enabled }}
        - name: mtls-certs
          secret:
            secretName: {{ include "pillar-csi.mtls.agentSecret" . }}
            defaultMode: 0o400
        {{- end }}
      # ── Scheduling ─────────────────────────────────────────────────────────
      # Run only on nodes labelled as storage nodes.
      nodeSelector:
        {{- toYaml .Values.agent.nodeSelector | nindent 8 }}
      {{- with .Values.agent.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
