apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "pillar-csi.fullname" . }}-agent
  namespace: {{ include "pillar-csi.namespace" . }}
  labels:
    {{- include "pillar-csi.componentLabels" (dict "root" . "component" "agent") | nindent 4 }}
  {{- with .Values.agent.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "pillar-csi.componentSelectorLabels" (dict "root" . "component" "agent") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pillar-csi.componentSelectorLabels" (dict "root" . "component" "agent") | nindent 8 }}
        {{- with .Values.agent.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.agent.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      # hostNetwork: true is required for the NVMe-oF/iSCSI data plane.
      # The kernel binds nvmet_tcp listening sockets in the netns of the
      # process that writes configfs `enable=1` (the agent).  With
      # hostNetwork: false that listener lives in the pod netns and is
      # unreachable from the host network where initiators connect.  See
      # PRD §2.4 for the full rationale and operator override.
      hostNetwork: {{ .Values.agent.hostNetwork }}
      {{- if .Values.agent.hostNetwork }}
      # When hostNetwork is true the pod uses the host's DNS resolver by
      # default, which can break in-cluster service lookups (kube-dns).
      # ClusterFirstWithHostNet keeps cluster DNS available.
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "pillar-csi.agentServiceAccountName" . }}
      # terminationGracePeriodSeconds is the upper bound for the whole shutdown
      # sequence: kubelet sends SIGTERM → preStop (5s wait for the endpoint
      # controller to propagate readiness=false) → the binary's SIGTERM handler
      # flips gRPC health to NOT_SERVING, runs Drain (waits for in-flight
      # per-target operations to release their locks), waits the configured
      # --shutdown-grace-period, then GracefulStop completes any remaining
      # accepted RPCs.  60s gives the slowest path (drain + grace + RPC tail)
      # comfortable headroom on a busy node without blocking node drain forever.
      terminationGracePeriodSeconds: 60
      # ── Init containers ────────────────────────────────────────────────────
      # Loads target kernel modules. Failures are silently ignored (best-effort):
      # the pod does NOT fail to start if a module cannot be loaded.
      initContainers:
        - name: modprobe
          image: {{ include "pillar-csi.image" (dict "image" .Values.agent.initModprobe.image "defaultTag" .Values.agent.initModprobe.image.tag) }}
          imagePullPolicy: {{ include "pillar-csi.imagePullPolicy" (dict "image" .Values.agent.initModprobe.image "global" .Values.imagePullPolicy) }}
          # Run modprobe for each module; || true ensures the init container
          # always exits 0 so the pod is not blocked on module-load failure.
          command:
            - /bin/sh
            - -c
            - |
              {{- range .Values.agent.initModprobe.modules }}
              modprobe {{ . }} || true
              {{- end }}
          securityContext:
            privileged: true
          volumeMounts:
            - name: lib-modules
              mountPath: /lib/modules
              readOnly: true
          resources:
            {{- toYaml .Values.agent.initModprobe.resources | nindent 12 }}
      # ── Main containers ────────────────────────────────────────────────────
      containers:
        - name: agent
          image: {{ include "pillar-csi.image" (dict "image" .Values.agent.image "defaultTag" .Chart.AppVersion) }}
          imagePullPolicy: {{ include "pillar-csi.imagePullPolicy" (dict "image" .Values.agent.image "global" .Values.imagePullPolicy) }}
          ports:
            - name: grpc
              containerPort: {{ .Values.agent.grpcPort }}
              # hostPort is kept for explicit node-IP exposure even though
              # hostNetwork: true already binds the listener on every host
              # interface; it lets the chart consumer point a Service /
              # firewall rule at a stable port rather than introspecting
              # the agent container's listen address (PRD §2.4).
              {{- if .Values.agent.hostPort }}
              hostPort: {{ .Values.agent.hostPort }}
              {{- end }}
              protocol: TCP
          securityContext:
            # CAP_SYS_ADMIN is required for NVMe-oF / iSCSI target management
            # (configfs writes, block device operations).
            # runAsUser 0 overrides the Dockerfile USER directive because ZFS and
            # configfs operations require root.
            runAsUser: 0
            capabilities:
              add:
                - SYS_ADMIN
            # privileged is false by default; set agent.privileged=true in values
            # when the agent must open host character devices (e.g. /dev/zfs) in
            # nested-container environments (Kind) where cgroup device controllers
            # block non-privileged access even for root+SYS_ADMIN containers.
            privileged: {{ .Values.agent.privileged | default false }}
            allowPrivilegeEscalation: true
          args:
            - --listen-address=:{{ .Values.agent.grpcPort }}
            {{- range .Values.agent.backends }}
            - --backend
            - {{ printf "type=%s,pool=%s" .type .pool }}{{ if .parent }}{{ printf ",parent=%s" .parent }}{{ end }}
            {{- end }}
            {{- if .Values.mtls.enabled }}
            - --tls-cert={{ include "pillar-csi.mtls.certDir" . }}/tls.crt
            - --tls-key={{ include "pillar-csi.mtls.certDir" . }}/tls.key
            - --tls-ca={{ include "pillar-csi.mtls.certDir" . }}/ca.crt
            {{- end }}
            {{- range .Values.agent.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- with .Values.agent.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # gRPC native probes (kubelet >=1.24 beta, >=1.27 GA) read the
          # standard grpc.health.v1 Health service the binary registers on
          # the same gRPC port.  Kubelet flips the pod out of the Service
          # endpoints as soon as readiness fails, which is what preStop
          # waits 5s for before the binary's SIGTERM Drain runs.
          livenessProbe:
            grpc:
              port: {{ .Values.agent.grpcPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            grpc:
              port: {{ .Values.agent.grpcPort }}
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          # preStop gives the endpoint controller time to propagate
          # readiness=false (and route new traffic away) BEFORE SIGTERM
          # triggers Drain in the binary.  Drain itself only blocks until
          # in-flight per-target ops release; the 5s here is purely the
          # routing-propagation budget.
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          volumeMounts:
            # configfs — required for NVMe-oF target configuration via nvmet.
            - name: sys-kernel-config
              mountPath: /sys/kernel/config
            # /dev — required for block device operations (target backstores).
            - name: dev
              mountPath: /dev
            {{- if .Values.mtls.enabled }}
            - name: mtls-certs
              mountPath: {{ include "pillar-csi.mtls.certDir" . }}
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
      # ── Volumes ────────────────────────────────────────────────────────────
      volumes:
        # /sys/kernel/config — configfs filesystem for NVMe-oF target management.
        - name: sys-kernel-config
          hostPath:
            path: /sys/kernel/config
            type: DirectoryOrCreate
        # /dev — block device nodes needed for target backstores.
        - name: dev
          hostPath:
            path: /dev
            type: Directory
        # /lib/modules — read-only access for the modprobe init container.
        - name: lib-modules
          hostPath:
            path: /lib/modules
            type: Directory
        {{- if .Values.mtls.enabled }}
        - name: mtls-certs
          secret:
            secretName: {{ include "pillar-csi.mtls.agentSecret" . }}
            defaultMode: 0o400
        {{- end }}
      # ── Scheduling ─────────────────────────────────────────────────────────
      # Run only on nodes labelled as storage nodes.
      nodeSelector:
        {{- toYaml .Values.agent.nodeSelector | nindent 8 }}
      {{- with .Values.agent.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
