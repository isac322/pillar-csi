{{/*
Role + RoleBinding: lets the pillar-csi controller read the iSCSI CHAP Secrets
named by PillarProtocol spec.protocol.iscsi.auth.secretRef.  Secret access is
namespaced to the installation namespace on purpose: the controller never
gets cluster-wide Secret access.  get reads a Secret at each agent call that
configures CHAP; list/watch keep the PillarProtocol Ready condition in step
with the Secret.
Controlled by .Values.rbac.create (same toggle as clusterrole.yaml).
*/}}
{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "pillar-csi.fullname" . }}-secret-reader
  namespace: {{ include "pillar-csi.namespace" . }}
  labels:
    {{- include "pillar-csi.componentLabels" (dict "root" . "component" "controller") | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "pillar-csi.fullname" . }}-secret-reader
  namespace: {{ include "pillar-csi.namespace" . }}
  labels:
    {{- include "pillar-csi.componentLabels" (dict "root" . "component" "controller") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "pillar-csi.fullname" . }}-secret-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "pillar-csi.controllerServiceAccountName" . }}
    namespace: {{ include "pillar-csi.namespace" . }}
{{- end }}
