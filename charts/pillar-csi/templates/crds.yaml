            type: object
          spec:
            description: PillarStorageClassSpec defines the desired state of PillarStorageClass.
            properties:
              filesystem:
                description: |-
                  filesystem configures the filesystem axis for volumes of this binding:
                  which filesystem the node formats and which mount options it applies.
                properties:
