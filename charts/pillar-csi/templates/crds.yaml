            description: spec holds the immutable volume identity and routing parameters.
            properties:
              agentRef:
                description: agentRef is the name of the PillarAgent that hosts this
                  volume.
                minLength: 1
                type: string
              agentVolumeID:
                description: |-
                  agentVolumeID is the volume identifier used in agent RPCs.  The format
                  is "<pool>/<volume-name>" where pool is the storage pool name (e.g. ZFS
                  pool name), or just "<volume-name>" for backends with no pool prefix.
                minLength: 1
                type: string
              backendType:
                description: |-
                  backendType is the storage backend routing token (e.g. "zfs-zvol",
                  "lvm-lv").  It is the backend member selected by the store's
                  spec.backend union at CreateVolume time.
                type: string
              capacityBytes:
                description: capacityBytes is the requested volume size in bytes.
                format: int64
                minimum: 0
                type: integer
              claimRef:
                description: |-
                  claimRef identifies the PersistentVolumeClaim this volume was
                  provisioned for, when the provisioner named it (external-provisioner
                  --extra-create-metadata); its UID is read from the claim at the first
                  CreateVolume.  The controller uses it to recognize a provisioning
                  attempt that was abandoned because its claim was removed before any
                  PersistentVolume was created.  Without it the claim UID is derived from
                  the default "pvc-<claim UID>" volume name.
                properties:
                  name:
                    type: string
                  namespace:
                    description: namespace is the namespace of the PersistentVolumeClaim.
                    type: string
                  uid:
                    description: uid is the UID of the PersistentVolumeClaim.
                    minLength: 1
                    type: string
                required:
                - uid
                type: object
              importedFrom:
                description: |-
                  importedFrom records the full source dataset name when the volume was
                  adopted from an existing ZFS zvol via the
                  "pillar-csi.bhyoo.com/import-zvol" PVC annotation (e.g.
                  "hot-data/k8s/pvc-abc123"), instead of being created empty.  The field
                  is informational — the imported zvol keeps its data but becomes a
                  normal volume: DeleteVolume destroys it, and the annotation has no
                  effect once the volume exists.
                type: string
              lvmSource:
                description: |-
                  lvmSource pins the pre-existing LVM logical volume this volume adopted
                  via the "pillar-csi.bhyoo.com/import-lv" PVC annotation, by name and
                  by stable VG/LV UUIDs, together with the adoption policy.  It is set
                  once at the first CreateVolume attempt and is immutable: it can be
                  neither changed nor added or removed after creation.  Absent for
                  volumes created empty and for zvol imports (see importedFrom), which
                  keep their existing semantics.
                properties:
                  logicalVolume:
                    description: logicalVolume is the LVM logical volume name of the
                      adopted LV.
                    minLength: 1
                    type: string
                  logicalVolumeUUID:
                    description: |-
                      logicalVolumeUUID is the LVM UUID of the logical volume
                      (`lvs -o lv_uuid`).
                    pattern: ^[A-Za-z0-9]{6}(-[A-Za-z0-9]{4}){5}-[A-Za-z0-9]{6}$
                    type: string
                  preserveOriginal:
                    description: |-
                      preserveOriginal selects the adoption policy.  When true, DeleteVolume
                      only releases the LV (never lvremove), expansion is refused, and the
                      node never formats, fscks or resizes it.  When false (policy Managed)
                      the adopted LV becomes a normal managed volume.
                    type: boolean
                  volumeGroup:
                    description: volumeGroup is the LVM volume group name of the adopted
                      LV.
                    minLength: 1
                    type: string
                  volumeGroupUUID:
                    description: volumeGroupUUID is the LVM UUID of the volume group
                      (`vgs -o vg_uuid`).
                    pattern: ^[A-Za-z0-9]{6}(-[A-Za-z0-9]{4}){5}-[A-Za-z0-9]{6}$
                    type: string
                required:
                - logicalVolume
                - logicalVolumeUUID
                - preserveOriginal
                - volumeGroup
                - volumeGroupUUID
                type: object
                x-kubernetes-validations:
                - message: lvmSource is immutable
                  rule: self == oldSelf
              protocolType:
                description: |-
                  protocolType is the network storage protocol routing token
                  (e.g. "nvmeof-tcp").  It is the protocol member selected by the
                  protocol's spec.protocol union at CreateVolume time.
                type: string
              recovery:
                description: |-
                  recovery declares that this volume record exists solely to receive an
                  operator-authorized ownership transfer of a pre-existing adopted
                  backend resource (see VolumeRecoveryIntent).  It is set at creation
                  for a volume born in phase RecoveryPending and cannot be added or
                  removed after creation.  Mutually exclusive with lvmSource and
                  importedFrom — a recovery volume is not itself an import.

                  The fields the operator cannot know at create time — newVolumeUID
                  (this object's own metadata.uid), authorization and
                  authorizationDigest — are write-once: they may be empty at create and
                  populated exactly once afterwards; every other field is immutable
                  from creation.
                properties:
                  authorization:
                    description: |-
                      authorization is the serialized RecoveryAuthorization protobuf (the
                      operator-signed grant).  It may be empty at creation — the operator
                      can only sign once metadata.uid exists.  It is not write-once at the
                      schema level (CEL does not compare these raw bytes); it may be
                      re-supplied on retry, but only bytes whose canonical digest equals
                      authorizationDigest are ever used, and the agent verifies the
                      signature.  When absent at transfer time the authorization must be
                      supplied out-of-band, with authorizationDigest pinning its identity.
                    format: byte
                    type: string
                  authorizationDigest:
                    description: |-
                      authorizationDigest is the lowercase hex SHA-256 of the
                      RecoveryAuthorization's deterministic protobuf encoding with its
                      signature field cleared.  It pins the exact grant this record may
                      consume; the fence mark stores the same digest after transfer.  It
                      may be empty at creation and is write-once once populated.  The
                      transfer requires it to be set.
                    maxLength: 64
                    minLength: 64
                    pattern: ^[0-9a-f]{64}$
                    type: string
                  newGeneration:
                    description: |-
                      newGeneration is the generation the agent writes into the
                      transferred fence mark for the new lifecycle.  Immutable from
                      creation.
                    format: int64
                    minimum: 0
                    type: integer
                    x-kubernetes-validations:
                    - message: newGeneration is immutable
                      rule: self == oldSelf
                  newVolumeUID:
                    description: |-
                      newVolumeUID is the destination lifecycle UID; when set it MUST
                      equal this PillarVolumeState's metadata.uid.  It is unknowable at
                      create (the API server assigns metadata.uid), so it may be empty at
                      creation and is write-once once populated.  The transfer requires
                      it to be set.
                    minLength: 1
                    type: string
                  oldGeneration:
                    description: |-
                      oldGeneration is the exact publication generation recorded in the
                      old lifecycle's fence mark.  Exact equality required.  Immutable
                      from creation.
                    format: int64
                    minimum: 0
                    type: integer
                    x-kubernetes-validations:
                    - message: oldGeneration is immutable
                      rule: self == oldSelf
                  oldVolumeUID:
                    description: |-
                      oldVolumeUID is the UID of the retired PillarVolumeState lifecycle
                      whose backend resource is recovered (the fence mark's current
                      volume_uid).  Immutable from creation.
                    minLength: 1
                    type: string
                    x-kubernetes-validations:
                    - message: oldVolumeUID is immutable
                      rule: self == oldSelf
                  source:
                    description: |-
                      source pins the adopted LVM logical volume being recovered by name
                      and stable VG/LV UUIDs; its preserveOriginal is the recovery
                      preserve policy.  Immutable from creation.
                    properties:
                      logicalVolume:
                        description: logicalVolume is the LVM logical volume name
                          of the adopted LV.
                        minLength: 1
                        type: string
                      logicalVolumeUUID:
                        description: |-
                          logicalVolumeUUID is the LVM UUID of the logical volume
                          (`lvs -o lv_uuid`).
                        pattern: ^[A-Za-z0-9]{6}(-[A-Za-z0-9]{4}){5}-[A-Za-z0-9]{6}$
                        type: string
                      preserveOriginal:
                        description: |-
                          preserveOriginal selects the adoption policy.  When true, DeleteVolume
                          only releases the LV (never lvremove), expansion is refused, and the
                          node never formats, fscks or resizes it.  When false (policy Managed)
                          the adopted LV becomes a normal managed volume.
                        type: boolean
                      volumeGroup:
                        description: volumeGroup is the LVM volume group name of the
                          adopted LV.
                        minLength: 1
                        type: string
                      volumeGroupUUID:
                        description: volumeGroupUUID is the LVM UUID of the volume
                          group (`vgs -o vg_uuid`).
                        pattern: ^[A-Za-z0-9]{6}(-[A-Za-z0-9]{4}){5}-[A-Za-z0-9]{6}$
                        type: string
                    required:
                    - logicalVolume
                    - logicalVolumeUUID
                    - preserveOriginal
                    - volumeGroup
                    - volumeGroupUUID
                    type: object
                    x-kubernetes-validations:
                    - message: source is immutable
                      rule: self == oldSelf
                required:
                - newGeneration
                - oldGeneration
                - oldVolumeUID
                - source
                type: object
                x-kubernetes-validations:
                - message: newVolumeUID and authorizationDigest are write-once once
                    populated
                  rule: (!has(oldSelf.newVolumeUID) || (has(self.newVolumeUID) &&
                    self.newVolumeUID == oldSelf.newVolumeUID)) && (!has(oldSelf.authorizationDigest)
                    || (has(self.authorizationDigest) && self.authorizationDigest
                    == oldSelf.authorizationDigest))
              resolved:
                description: |-
                  resolved is the effective per-volume configuration resolved at the
                  first CreateVolume attempt from the PillarStore, PillarProtocol,
                  PillarStorageClass overrides, StorageClass parameter documents and PVC
                  annotations (in that precedence order).  It is replayed on every retry
                  so the volume keeps the settings it was provisioned with even when the
                  claim or the CRDs behind the overrides no longer exist.
                properties:
                  backend:
                    description: |-
                      backend is the effective storage backend configuration: the store's
                      spec.backend with binding, StorageClass-document and PVC tunable
                      overrides applied.
                    properties:
                      lvm:
                        description: lvm holds LVM-specific configuration.
                        properties:
                          provisioningMode:
                            default: linear
                            description: |-
                              provisioningMode controls whether new volumes are created as fully-
                              allocated linear LVs or as thin-provisioned LVs inside the thinPool.
                              Defaults to "linear"; set to "thin" together with a non-empty thinPool
                              to enable thin provisioning.
                            enum:
                            - linear
                            - thin
                            type: string
                          thinPool:
                            description: |-
                              thinPool is the name of the LVM thin pool LV within the volume group
                              (e.g. "thin-pool-0").  When non-empty the backend operates in thin-
                              provisioned mode; when empty it creates fully-allocated linear LVs.
                              The thin pool must be pre-created before the agent starts, and must
                              equal the thinPool of the agent's backend configuration for this VG
                              (chart agent.backends[].lvm.thinPool; empty = none): on a mismatch the
                              store is not Ready (PoolDiscovered=False, BackendLayoutMismatch) and
                              CreateVolume fails instead of using another thin pool.
                            type: string
                          volumeGroup:
                            description: |-
                              volumeGroup is the LVM Volume Group name that pillar-csi will create
                              logical volumes in (e.g. "data-vg").  The VG must be pre-created on
                              the node before the agent starts; the driver does not manage VG lifecycle.
                            minLength: 1
                            type: string
                        required:
                        - volumeGroup
                        type: object
                      zfs:
                        description: zfs holds ZFS-specific configuration.
                        properties:
                          parentDataset:
                            description: |-
                              parentDataset is the ZFS dataset path under which pillar-csi will
                              create per-volume zvols or datasets (e.g. "k8s").  It must equal the
                              parentDataset of the agent's backend configuration for this pool.
                            type: string
                          pool:
                            description: pool is the ZFS pool name (e.g. "hot-data").
                            minLength: 1
                            type: string
                          properties:
                            additionalProperties:
                              type: string
                            description: |-
                              properties are arbitrary ZFS properties applied to every volume created
                              in this pool (e.g. compression, volblocksize).
                            type: object
                          volumeType:
                            default: zvol
                            description: volumeType selects the ZFS volume kind.
                            enum:
                            - zvol
                            - dataset
                            type: string
                        required:
                        - pool
                        type: object
                    type: object
                    x-kubernetes-validations:
                    - message: exactly one of zfs or lvm must be set
                      rule: '(has(self.zfs) ? 1 : 0) + (has(self.lvm) ? 1 : 0) ==
                        1'
                  filesystem:
                    description: |-
                      filesystem is the effective filesystem configuration the node applies
                      when the volume is a Filesystem-mode mount.
                    properties:
                      fsType:
                        description: |-
                          fsType is the filesystem type the node uses for a block volume in
                          Filesystem mode.  The controller defaults omitted values to ext4;
                          file protocols such as NFS use their protocol filesystem instead.
                        enum:
                        - ext4
                        - xfs
                        - nfs
                        type: string
                      mkfsOptions:
                        description: |-
                          mkfsOptions are additional mkfs arguments used when the node formats a
                          new volume; a volume that already carries a filesystem is never
                          reformatted.  Each element is one argv element (no shell); only
                          filesystem tuning flags of the formatted type are accepted.
                          A null/omitted value inherits the options of the layer below; an
                          explicit empty list [] clears them.
                        items:
                          type: string
                        type: array
                      mountOptions:
                        description: |-
                          mountOptions are the mount options the node applies when mounting a
                          Filesystem-mode volume.  On a PillarStorageClass they are written to
                          the generated Kubernetes StorageClass's mountOptions; a PVC annotation
                          value overrides them for that volume.
                          A null/omitted value inherits the options of the layer below; an
                          explicit empty list [] clears them.
                        items:
                          type: string
                        type: array
                      periodicTrim:
                        description: |-
                          periodicTrim controls whether the CSI node periodically trims (FITRIM)
                          the staged filesystem of a Filesystem-mode volume so the backend can
                          reclaim freed blocks.  Unset follows the node setting (enabled unless
                          the node's --trim-interval is 0); false opts the volume out.  A PVC
                          annotation value overrides the class value for that volume.
                        type: boolean
                    type: object
                  localAttach:
                    description: |-
                      localAttach is true when the volume may be attached directly on the
                      storage node, bypassing the network protocol, whenever it is published
                      to the node that hosts its PillarAgent.  Publishes to any other node
                      always use the protocol.
                    type: boolean
                  protocol:
                    description: |-
                      protocol is the effective transport configuration: the protocol's
                      spec.protocol with binding, StorageClass-document and PVC tunable
                      overrides applied.
                    properties:
                      iscsi:
                        description: iscsi holds iSCSI configuration.
                        properties:
                          acl:
                            default: false
                            description: |-
                              acl enables initiator IQN-based access control when true.
                              When false the target portal group runs in demo mode
                              (generate_node_acls) and accepts any initiator.
                              Defaults to false so that e2e tests and simple deployments work
                              without registering initiator IQNs.
                            type: boolean
                          auth:
                            description: |-
                              auth configures iSCSI CHAP authentication.  Unset is method None
                              (initiator IQN ACLs only).  Auth is fixed per volume at CreateVolume:
                              a later change applies only to volumes provisioned afterwards, and it
                              cannot be overridden per binding or per volume.  CHAP credentials are
                              set on the per-initiator ACLs, so CHAP and MutualCHAP require acl: true.
                            properties:
                              method:
                                default: None
                                description: method selects the authentication method.
                                enum:
                                - None
                                - CHAP
                                - MutualCHAP
                                type: string
                              secretRef:
                                description: |-
                                  secretRef names the Secret holding the CHAP credentials in the
                                  pillar-csi installation namespace.  Required unless method is None.
                                properties:
                                  name:
                                    description: name is the name of the Secret.
                                    minLength: 1
                                    type: string
                                required:
                                - name
                                type: object
                            type: object
                          loginTimeout:
                            description: |-
                              loginTimeout is the maximum seconds the initiator waits for a login
                              (TCP connect plus the login PDU exchange) to complete.
                            format: int32
                            minimum: 1
                            type: integer
                          noopOutInterval:
                            description: |-
                              noopOutInterval is the interval in seconds between NOP-Out pings the
                              initiator sends to detect a dead connection.  0 disables the pings.
                            format: int32
                            minimum: 0
                            type: integer
                          noopOutTimeout:
                            description: |-
                              noopOutTimeout is the maximum seconds the initiator waits for a
                              NOP-In reply before declaring the connection failed.
                            format: int32
                            minimum: 0
                            type: integer
                          port:
                            default: 3260
                            description: |-
                              port is the TCP port on which the iSCSI target portal listens.
                              Defaults to 3260.
                            format: int32
                            maximum: 65535
                            minimum: 1
                            type: integer
                          replacementTimeout:
                            description: |-
                              replacementTimeout is the maximum seconds the initiator keeps I/O
                              queued while re-establishing a failed session before failing it back
                              to the block layer.  0 fails I/O immediately on connection loss.
                            format: int32
                            minimum: 0
                            type: integer
                        type: object
                        x-kubernetes-validations:
                        - message: auth.secretRef is required when auth.method is
                            CHAP or MutualCHAP
                          rule: '!has(self.auth) || self.auth.method == ''None'' ||
                            has(self.auth.secretRef)'
                        - message: 'auth.method CHAP and MutualCHAP require acl: true'
                          rule: '!has(self.auth) || self.auth.method == ''None'' ||
                            self.acl'
                      nfs:
                        description: nfs holds NFS configuration.
                        properties:
                          acl:
                            default: false
                            description: |-
                              acl enables client-IP access control.
                              Defaults to false.
                            type: boolean
                          port:
                            default: 2049
                            description: port is the fixed NFS listener port.
                            format: int32
                            maximum: 2049
                            minimum: 2049
                            type: integer
                          squash:
                            default: root
                            description: |-
                              squash selects the NFS identity squashing policy.
                              Defaults to root.
                            enum:
                            - root
                            - none
                            - all
                            type: string
                          version:
                            default: "4.2"
                            description: version is the NFS protocol version.
                            enum:
                            - "4.2"
                            type: string
                        type: object
                      nvmeofTcp:
                        description: nvmeofTcp holds NVMe-oF/TCP configuration.
                        properties:
                          acl:
                            default: false
                            description: |-
                              acl enables host NQN-based access control when true.
                              When false the subsystem uses allow_any_host.
                              Defaults to false (allow_any_host) so that e2e tests and simple
                              deployments work without registering initiator NQNs.
                            type: boolean
                          ctrlLossTmo:
                            description: |-
                              ctrlLossTmo is the maximum seconds to wait before declaring a target
                              permanently lost after connectivity failure.
                            format: int32
                            minimum: 0
                            type: integer
                          inCapsuleDataSize:
                            description: |-
                              inCapsuleDataSize is the maximum in-capsule data size in bytes the
                              target advertises (the nvmet port's param_inline_data_size).  It is a
                              property of the listening port, shared by every volume exported on the
                              same storage node address and port: exporting a volume that requests a
                              value different from the port's current value fails instead of
                              silently using the port's value.  Unset keeps the transport default
                              (16384 for TCP on 4 KiB pages) and accepts whatever value the port has.
                              The minimum is 1024: NVMe/TCP hosts send the 1024-byte fabrics Connect
                              data in-capsule, so a smaller value makes every connect fail.
                            format: int32
                            minimum: 1024
                            type: integer
                          maxDataTransferSize:
                            description: |-
                              maxDataTransferSize is the largest data transfer, in bytes, of one
                              NVMe I/O command (MDTS).  Unset resolves to 4194304 (4 MiB); 0 means
                              no limit.  Any other value is a power of two from 8192 to 1073741824.

                              The target advertises it through the nvmet port's param_mdts on
                              Linux 7.1 and later.  Like inCapsuleDataSize it is a property of the
                              listening port, shared by every volume exported on the same storage
                              node address and port, but a volume's value is an upper bound: a port
                              advertising a smaller limit only makes commands smaller.  Exporting a
                              volume therefore fails only when the port already advertises a larger
                              limit than the volume's (non-zero) value.  A port that advertises no
                              limit accepts any value, and when the agent restores the exports of a
                              port, for example after the storage node rebooted, it sets the port to
                              the smallest value among them before exporting any.  An older target
                              kernel cannot advertise a limit (MDTS 0); the node then caps the
                              volume's queue/max_sectors_kb to this size itself, which keeps large
                              writes from failing on a storage node whose memory is too fragmented
                              to allocate a whole command's scatterlist.  A node whose target
                              advertises any limit leaves the device unchanged.  The node cannot set
                              queue/max_sectors_kb below one memory page, so on a worker with
                              16 KiB or 64 KiB pages a non-zero value smaller than the page size
                              fails NodeStageVolume with InvalidArgument instead of being rounded
                              up.
                            enum:
                            - 0
                            - 8192
                            - 16384
                            - 32768
                            - 65536
                            - 131072
                            - 262144
                            - 524288
                            - 1048576
                            - 2097152
                            - 4194304
                            - 8388608
                            - 16777216
                            - 33554432
                            - 67108864
                            - 134217728
                            - 268435456
                            - 536870912
                            - 1073741824
                            format: int32
                            type: integer
                          maxQueueSize:
                            description: |-
                              maxQueueSize is the I/O queue depth the initiator requests for each
                              queue of the connection (the fabrics queue_size connect option).
                              Unset keeps the kernel default (128).  The kernel accepts 16-1024.
                              Applies to connections made after the change; a staged volume keeps
                              the value from its CreateVolume.
                            format: int32
                            maximum: 1024
                            minimum: 16
                            type: integer
                          port:
                            default: 4420
                            description: |-
                              port is the TCP port on which the NVMe-oF target listens.
                              Defaults to 4420.
                            format: int32
                            maximum: 65535
                            minimum: 1
                            type: integer
                          reconnectDelay:
                            description: reconnectDelay is the interval in seconds
                              between reconnect attempts.
                            format: int32
                            minimum: 0
                            type: integer
                        type: object
                    type: object
                    x-kubernetes-validations:
                    - message: 'exactly one protocol member must be set (supported:
                        nvmeofTcp, iscsi, nfs)'
                      rule: '(has(self.nvmeofTcp) ? 1 : 0) + (has(self.iscsi) ? 1
                        : 0) + (has(self.nfs) ? 1 : 0) == 1'
                required:
                - backend
                - protocol
                type: object
              volumeID:
                description: |-
                  volumeID is the CSI volume ID assigned by the controller.
                  Format: <target-name>/<protocol-type>/<backend-type>/<agent-vol-id>
                minLength: 1
                type: string
            required:
            - agentRef
            - agentVolumeID
            - backendType
            - protocolType
            - volumeID
            type: object
            x-kubernetes-validations:
            - message: importedFrom and lvmSource are mutually exclusive
              rule: '!(has(self.importedFrom) && has(self.lvmSource))'
            - message: lvmSource cannot be added or removed after creation
              rule: has(self.lvmSource) == has(oldSelf.lvmSource)
            - message: recovery is mutually exclusive with lvmSource and importedFrom
              rule: '!(has(self.recovery) && (has(self.lvmSource) || has(self.importedFrom)))'
            - message: recovery cannot be added or removed after creation
              rule: has(self.recovery) == has(oldSelf.recovery)
          status:
            description: status reflects the mutable lifecycle state of the volume.
            properties:
              backendDevicePath:
                description: |-
                  backendDevicePath is the device path returned by agent.CreateVolume
                  (e.g. "/dev/zvol/pool/pvc-abc123").  Persisted when the volume enters
                  the CreatePartial phase so that a retry of CreateVolume can skip the
                  backend-creation step and call agent.ExportVolume directly, using this
                  stored path rather than re-querying the agent.
                  Cleared when the volume reaches the Ready phase.
                type: string
              conditions:
                description: |-
                  conditions represent the current observed state of the PillarVolumeState.

                  Known condition types:
                  - "BackendCreated"  – the backend storage resource exists on the agent.
                  - "ExportCreated"   – the network export exists on the agent.
                  - "Ready"           – both backend and export exist; volume is usable.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              deleting:
                description: |-
                  deleting is set by DeleteVolume before it removes the export and the
                  backend resource.  It is written by a resourceVersion compare-and-swap
                  that only succeeds while publishedNodes is empty, so a volume can never
                  be concurrently published and deleted.  ControllerPublishVolume rejects
                  reservations while deleting is true, and state resync skips the volume.
                type: boolean
              exportInfo:
                description: |-
                  exportInfo holds the network export parameters returned by ExportVolume.
                  Populated when phase is Ready or later.  Used by DeleteVolume to
                  unmount the export after a controller restart without re-querying the
                  agent.
                properties:
                  address:
                    description: |-
                      address is the IP address of the storage node (same as
                      PillarAgent.Status.ResolvedAddress with the port stripped).
                    type: string
                  port:
                    description: |-
                      port is the TCP port on which the protocol target listens.
                      NFS uses its fixed port 2049.
                    format: int32
                    type: integer
                  targetID:
                    description: |-
                      targetID is the protocol-specific export identifier: NQN for NVMe-oF,
                      IQN for iSCSI, or the server export path for NFS.
                    type: string
                  volumeRef:
                    description: volumeRef is the protocol-level reference for this
                      volume.
                    type: string
                type: object
              exportSpec:
                description: |-
                  exportSpec is the export configuration the controller requested at
                  CreateVolume time.  It is the durable desired state the resync
                  controller uses to re-create the export after the storage node loses
                  its target state.  Volumes created before this field existed have no
                  exportSpec and are reported via the ExportReconciled condition instead
                  of being recovered.
                properties:
                  aclEnabled:
                    description: |-
                      aclEnabled is true when the target admits only the initiators of
                      published nodes; false admits any initiator.
                    type: boolean
                  bindAddress:
                    description: bindAddress is the storage node address the target
                      listens on.
                    minLength: 1
                    type: string
                  inCapsuleDataSize:
                    description: |-
                      inCapsuleDataSize is the NVMe-oF/TCP in-capsule data size in bytes the
                      export requires on its port; absent when the export accepts the port's
                      value.  NVMe-oF/TCP only.
                    format: int32
                    minimum: 1024
                    type: integer
                  maxDataTransferSize:
                    description: |-
                      maxDataTransferSize is the NVMe-oF/TCP maximum data transfer size in
                      bytes (0 = no limit) the export allows its port to advertise at most;
                      absent when the export accepts the port's value.  NVMe-oF/TCP only.
                    enum:
                    - 0
                    - 8192
                    - 16384
                    - 32768
                    - 65536
                    - 131072
                    - 262144
                    - 524288
                    - 1048576
                    - 2097152
                    - 4194304
                    - 8388608
                    - 16777216
                    - 33554432
                    - 67108864
                    - 134217728
                    - 268435456
                    - 536870912
                    - 1073741824
                    format: int32
                    type: integer
                  nfs:
                    description: nfs contains the durable NFS-specific export configuration.
                    properties:
                      readonly:
                        description: readonly makes the export read-only for every
                          client.
                        type: boolean
                      squash:
                        description: squash is the NFS identity squashing policy.
                        enum:
                        - root
                        - none
                        - all
                        type: string
                      version:
                        description: version is the NFS protocol version.
                        enum:
                        - "4.2"
                        type: string
                    required:
                    - readonly
                    - squash
                    - version
                    type: object
                  port:
                    description: |-
                      port is the TCP port the target listens on; 0 selects the protocol's
                      default port, exactly as in the original export request.
                    format: int32
                    maximum: 65535
                    minimum: 0
                    type: integer
                required:
                - aclEnabled
                - bindAddress
                - port
                type: object
              importAcquired:
                description: |-
                  importAcquired records that agent.ImportVolume succeeded for a
                  spec.importedFrom volume: the agent durably adopted the pre-existing
                  zvol into this lifecycle.  While it is unset the lifecycle cannot prove
                  the agent ever took ownership, so ReapAbandonedVolume and DeleteVolume
                  end the lifecycle with agent.ReleaseVolume — which retires it at the
                  agent without touching the zvol — instead of UnexportVolume and
                  DeleteVolume, and ControllerExpandVolume and ControllerPublishVolume
                  refuse it: a refused or lost-response import that was torn down,
                  resized or exposed anyway would harm a zvol this driver never owned.
                type: boolean
              localAttachNode:
                description: |-
                  localAttachNode is the storage node on which the volume was last
                  attached directly.  It is set in the same update that reserves a local
                  publication and cleared only after the agent confirmed the backend
                  device is no longer held on that node and returned the export to
                  serving remote initiators.  While it is set the export serves no I/O
                  to remote initiators, including after an agent restart.
                type: string
              partialFailure:
                description: |-
                  partialFailure is populated whenever the volume is in a partial-failure
                  phase (CreatePartial, NodeStagePartial).  It records what succeeded and
                  what failed so that the recovery controller can take the minimum
                  necessary corrective action.  Cleared when the partial failure is
                  resolved.
                properties:
                  backendCreated:
                    description: |-
                      backendCreated is true when the backend storage resource (zvol, LVM LV,
                      etc.) was successfully created before the failure occurred.  When false,
                      DeleteVolume only needs to call UnexportVolume (idempotent no-op); when
                      true, it must also call DeleteVolume on the agent to reclaim the storage.
                    type: boolean
                  exportCreated:
                    description: |-
                      exportCreated is true when the network export (NVMe-oF subsystem) was
                      successfully created before the failure.  When
                      true, cleanup must call UnexportVolume before DeleteVolume.
                    type: boolean
                  failedAt:
                    description: failedAt is the time when the partial failure was
                      recorded.
                    format: date-time
                    type: string
                  failedOperation:
                    description: |-
                      failedOperation is the name of the CSI or agent-level operation that
                      failed (e.g., "ExportVolume", "NodeStageMount").
                    type: string
                  message:
                    description: |-
                      message is a human-readable sentence describing what failed and how to
                      recover.
                    type: string
                  reason:
                    description: |-
                      reason is a brief, machine-readable CamelCase word that describes the
                      category of failure (e.g., "AgentRPCFailed", "MountFailed").
                    type: string
                required:
                - failedAt
                - failedOperation
                type: object
              phase:
                description: |-
                  phase is the current lifecycle phase of the volume.
                  See PillarVolumeStatePhase for the full state diagram.
                enum:
                - Provisioning
                - CreatePartial
                - Ready
                - ControllerPublished
                - NodeStagePartial
                - NodeStaged
                - NodePublished
                - RecoveryPending
                type: string
              publicationGeneration:
                description: |-
                  publicationGeneration is a monotonically increasing counter bumped by
                  exactly 1 on every status update that changes publishedNodes or sets
                  deleting.  The value committed by that update is sent to the agent as
                  the fencing generation on AllowInitiator, DenyInitiator, UnexportVolume
                  and ReconcileState; the agent rejects any request carrying a lower
                  generation than the one it last applied.  This closes the window where
                  a stale (former leader) controller's in-flight RPC lands after a new
                  leader already changed the publication set.
                format: int64
                minimum: 0
                type: integer
              publishedNodes:
                description: |-
                  publishedNodes lists every node the volume is currently published to
                  by ControllerPublishVolume.  ControllerPublishVolume rejects a publish
                  that is incompatible with an existing entry (for example a second node
                  for a SINGLE_NODE_* access mode); ControllerUnpublishVolume removes the
                  entry after the agent revoked the node's access; DeleteVolume refuses
                  to delete a volume while this list is non-empty.  Entries are also the
                  exact initiator set the storage target's ACL must contain.
                items:
                  description: |-
                    VolumePublication records one node to which ControllerPublishVolume granted
                    access to this volume.  The list of publications is the durable source of
                    truth for CSI publish exclusivity (a SINGLE_NODE_* volume may be published
                    to at most one node) and for the initiator ACL set the storage target must
                    hold.  An entry is written before the agent grants access and removed only
                    after the agent revoked it, so a crash between the two steps leaves the
                    record fail-closed.
                  properties:
                    accessMode:
                      description: |-
                        accessMode is the CSI VolumeCapability access mode name requested by
                        the publish (e.g. "SINGLE_NODE_WRITER", "MULTI_NODE_READER_ONLY").
                      minLength: 1
                      type: string
                    initiatorID:
                      description: |-
                        initiatorID is the protocol-specific initiator identity granted access
                        (NVMe-oF host NQN, iSCSI IQN, or the node ID for file protocols).  It is
                        recorded so the grant can be revoked even after the node's CSINode
                        object is gone.
                      minLength: 1
                      type: string
                    local:
                      description: |-
                        local is true when the publication attaches the backend device
                        directly on the storage node instead of through the network export
                        (localAttach enabled and nodeID is the node of the volume's
                        PillarAgent).  A local publication grants no initiator: it is excluded
                        from the export's ACL set and its unpublish revokes nothing on the
                        target.
                      type: boolean
                    nodeID:
                      description: |-
                        nodeID is the CSI node_id (Kubernetes node name) the volume is
                        published to.
                      minLength: 1
                      type: string
                    readonly:
                      description: readonly mirrors ControllerPublishVolumeRequest.readonly.
                      type: boolean
                    revoking:
                      description: |-
                        revoking is set by ControllerUnpublishVolume in the same update that
                        allocates the fencing generation for the revoke, and the record is
                        removed once the agent revoked the initiator.  A revoking record still
                        occupies the volume for exclusivity (fail-closed) but is not part of the
                        initiator set the target should grant: state recovery must exclude it,
                        and a publish to the same node is rejected until the unpublish finishes.
                      type: boolean
                  required:
                  - accessMode
                  - initiatorID
                  - nodeID
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - nodeID
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
