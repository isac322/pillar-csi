---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-pillar-csi-bhyoo-com-v1alpha1-pillarstorageclass
  failurePolicy: Fail
  name: mpillarstorageclass-v1alpha1.kb.io
  rules:
  - apiGroups:
    - pillar-csi.bhyoo.com
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - pillarstorageclasses
  sideEffects: None
