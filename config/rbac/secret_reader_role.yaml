# permissions to read the iSCSI CHAP Secrets named by PillarProtocols.
# Namespaced on purpose: the controller reads Secrets only in its own
# (installation) namespace, never cluster-wide.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/name: pillar-csi
    app.kubernetes.io/managed-by: kustomize
  name: secret-reader-role
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
