apiVersion: pillar-csi.bhyoo.com/v1alpha1
kind: PillarStorageClass
metadata:
  labels:
    app.kubernetes.io/name: pillar-csi
    app.kubernetes.io/managed-by: kustomize
  name: pillarstorageclass-sample
spec:
  storeRef: pillarstore-sample
  protocolRef: pillarprotocol-sample
  storageClass:
    name: pillar-zfs-nvme
    reclaimPolicy: Delete
    volumeBindingMode: WaitForFirstConsumer
    allowVolumeExpansion: true
  filesystem:
    fsType: xfs
    mkfsOptions: ["-K"]
    mountOptions: [noatime]
  # Per-binding tunables; the member must match the store's backend and the
  # protocol's member.
  overrides:
    backend:
      zfs:
        properties:
          volblocksize: 16K
    protocol:
      nvmeofTcp:
        maxQueueSize: 64
