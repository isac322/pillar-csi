# External Storage TestDriver manifest for pillar-csi.
#
# Consumed by the upstream `e2e.test` binary from
# kubernetes/test/e2e/storage/external/external.go.  Run with:
#
#   e2e.test \
#     -storage.testdriver=external-driver.yaml \
#     -ginkgo.focus='External.Storage' \
#     -kubeconfig=$KUBECONFIG
#
# Capability flags reflect the RPCs that pillar-csi advertises through
# Identity.GetPluginCapabilities, Controller.ControllerGetCapabilities and
# Node.NodeGetCapabilities.  Toggle individual capabilities off as the driver
# implements them so the suite can pick up newly supported tests.
ShortName: pillar-csi
StorageClass:
  FromName: false
  FromFile: storage-class.yaml
SnapshotClass:
  FromName: false
DriverInfo:
  Name: pillar-csi.bhyoo.com
  SupportedSizeRange:
    Min: 1Mi
    Max: 100Gi
  SupportedFsTypes:
    ext4: {}
    xfs: {}
  Capabilities:
    persistence: true
    block: true
    fsGroup: true
    exec: true
    multipods: true
    controllerExpansion: true
    nodeExpansion: true
    # Offline expansion (PVC resize with no pod attached) is intentionally
    # disabled.  The storage backend (LVM lvextend) does resize the LV and
    # csi-resizer marks the PV with the new capacity, but with no pod
    # attached there is no node-side actor to call NodeExpandVolume and
    # transition the PVC's Resizing condition to FileSystemResizePending
    # before the upstream test's 2-minute pvcConditionSyncPeriod expires
    # (volume_expand.go WaitForPendingFSResizeCondition).  Online expansion
    # (PVC resize while a pod is mounted) is fully supported and exercised
    # by the "should resize volume when PVC is edited while pod is using
    # it" spec.  Re-enable this once the controller is taught to update the
    # PVC condition on its own for offline expand, or once a node-side
    # detached-volume rescan workflow lands.
    offlineExpansion: false
    onlineExpansion: true
    volumeLimits: false
    singleNodeVolume: true
    topology: true
    RWX: false
    snapshotDataSource: false
    pvcDataSource: false
  TopologyKeys:
    - pillar-csi.bhyoo.com/nvmeof
