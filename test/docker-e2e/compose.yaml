services:
  e2e:
    build:
      context: ../..
      dockerfile: test/docker-e2e/Dockerfile
      network: host
    privileged: true
    cgroup: host
    environment:
      DOCKER_TLS_CERTDIR: ""
      PILLAR_E2E_DNS: "${PILLAR_E2E_DNS:-1.1.1.1}"
      PILLAR_E2E_TOPOLOGIES: "${PILLAR_E2E_TOPOLOGIES:-internal external}"
    dns:
      - "${PILLAR_E2E_DNS:-1.1.1.1}"
    stop_grace_period: 5m
    volumes:
      - ../..:/workspace:ro
      - /sys/kernel/config:/sys/kernel/config:rshared
      - /lib/modules:/lib/modules:ro
      # NETLINK_ISCSI exists only in the host init network namespace; the
      # harness and the Kind workers (pillar-node) reach it as
      # /host/proc/1/ns/net.
      - /proc:/host/proc:ro
      - docker-data:/var/lib/docker
    tmpfs:
      - /run

volumes:
  docker-data:
