services:
  e2e:
    build:
      context: ../..
      dockerfile: test/docker-e2e/Dockerfile
    privileged: true
    cgroup: host
    environment:
      DOCKER_TLS_CERTDIR: ""
      PILLAR_E2E_DNS: "${PILLAR_E2E_DNS:-1.1.1.1}"
      PILLAR_E2E_TOPOLOGIES: "${PILLAR_E2E_TOPOLOGIES:-internal external}"
      PILLAR_E2E_PARALLEL: "${PILLAR_E2E_PARALLEL:-false}"
    dns:
      - "${PILLAR_E2E_DNS:-1.1.1.1}"
    stop_grace_period: 5m
    volumes:
      - ../..:/workspace:ro
      - /sys/kernel/config:/sys/kernel/config:rshared
      - /lib/modules:/lib/modules:ro
      # NETLINK_ISCSI exists only in the host init network namespace; the
      # harness and the Kind workers (pillar-node) reach it as
      # /host/proc/1/ns/net.
      - /proc:/host/proc:ro
      # Build caches that outlive the run.  `make test-docker-e2e` keeps these
      # volumes; `make clean-docker-e2e-cache` removes them.  docker-data holds
      # the nested Docker's images and BuildKit cache; entrypoint.sh removes its
      # containers, networks and volumes at the start and end of every run.
      # go-cache holds GOCACHE and GOMODCACHE for the harness's `go test`.
      - docker-data:/var/lib/docker
      - go-cache:/var/cache/pillar-csi
    tmpfs:
      - /run

volumes:
  docker-data:
  go-cache:
