name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Manual dispatch is used for reproducible post-merge measurements.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── changes ────────────────────────────────────────────────────────────────
  # Detects code and image-contract changes so behavior validation and
  # multi-platform OCI packaging can use different lanes.
  #
  # A workflow-level `paths-ignore` would not work here: Lint, Test, Build and
  # E2E are required status checks, and a workflow that never starts leaves
  # those checks pending, which blocks the pull request. A job skipped through
  # `if:` reports "skipped", which satisfies a required check.
  #
  # The gate fails closed: a heavy job is skipped only when this job succeeded
  # and reported no relevant change. If detection fails, every heavy job runs.
  # `!cancelled()` lets them start after a failed `changes` job, so jobs with
  # other prerequisites also check those results explicitly.
  #
  # `code` is true when any changed file lies outside site/** and **/*.md.
  # docs/E2E-TESTCASES.md is a test input (verify-tc-coverage and the e2e
  # catalog parse it), so it counts as code.
  #
  # `image_contract` is limited to files that change the OCI/Docker packaging
  # contract. Source changes are covered by the exact-checkout runtime image
  # and cross-platform Go compile lane below.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code == 'true' || steps.filter.outputs.tcspec == 'true' }}
      image_contract: ${{ steps.filter.outputs.image_contract == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v4.0.3
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            code:
              - '**'
              - '!site/**'
              - '!**/*.md'
            tcspec:
              - 'docs/E2E-TESTCASES.md'
            image_contract:
              - 'Dockerfile'
              - 'docker-bake.hcl'
              - '.dockerignore'
              - 'hack/verify-mkfs-baseline.sh'

  # ── docs ───────────────────────────────────────────────────────────────────
  # Generated reference docs must match api/v1alpha1 and the chart values, and
  # links in the README, CONTRIBUTING and site content must resolve.
  docs:
    name: Docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache documentation tools
        uses: actions/cache@v6.1.0
        with:
          path: bin/
          key: docs-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile', 'go.mod', 'go.sum') }}

      - name: Verify generated docs are up to date
        run: make docs-check

      - name: Check links
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: >-
            --config hack/docs/lychee.toml
            --root-dir ${{ github.workspace }}/site/src/content/docs
            README.md
            CONTRIBUTING.md
            'site/src/content/**/*.md'
            'site/src/content/**/*.mdx'

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Resolve Go build cache path
        id: goenv
        shell: bash
        run: |
          set -euo pipefail
          gocache="$(go env GOCACHE)"
          echo "gocache=${gocache}" >> "$GITHUB_OUTPUT"

      # The archive holds the Go build cache plus golangci-lint's native
      # analysis results (~/.cache/golangci-lint). The dependency-pinned
      # primary key avoids a per-source archive; Go verifies content-
      # addressed entries so changed sources still recompile.
      - name: Restore Go build and golangci-lint caches (read-only)
        if: ${{ github.event_name != 'push' || github.ref != 'refs/heads/master' }}
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ${{ steps.goenv.outputs.gocache }}
            ~/.cache/golangci-lint
          key: lint-objects-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.mod', 'go.sum', '.golangci.yml') }}

      - name: Restore and save Go build and golangci-lint caches (master)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        uses: actions/cache@v6.1.0
        with:
          path: |
            ${{ steps.goenv.outputs.gocache }}
            ~/.cache/golangci-lint
          key: lint-objects-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.mod', 'go.sum', '.golangci.yml') }}

      - name: Run linter
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.14.0

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Resolve Go build cache path
        id: goenv
        shell: bash
        run: |
          set -euo pipefail
          gocache="$(go env GOCACHE)"
          echo "gocache=${gocache}" >> "$GITHUB_OUTPUT"

      # Dependency-pinned key keeps one object archive per toolchain and
      # module set instead of publishing a new archive per source SHA;
      # Go still revalidates changed sources against content hashes.
      - name: Restore Go build cache (read-only)
        if: ${{ github.event_name != 'push' || github.ref != 'refs/heads/master' }}
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ steps.goenv.outputs.gocache }}
          key: test-gocache-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.mod', 'go.sum') }}

      - name: Restore and save Go build cache (master)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        uses: actions/cache@v6.1.0
        with:
          path: ${{ steps.goenv.outputs.gocache }}
          key: test-gocache-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.mod', 'go.sum') }}

      - name: Cache test tools
        uses: actions/cache@v6.1.0
        with:
          path: bin/
          key: test-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile', 'go.mod', 'go.sum') }}

      - name: Run tests
        shell: bash
        run: |
          set +e
          make test 2>&1 | tee /tmp/make-test.log
          MAKE_RC=${PIPESTATUS[0]}
          set -e
          awk '
            /^=== TC Coverage Verification/ { capture=1 }
            capture { print }
            capture && /^=== done ===$/ { exit }
          ' /tmp/make-test.log > /tmp/tc-coverage-report.txt
          exit "${MAKE_RC}"

      - name: Emit coverage summary
        if: always()
        run: |
          REPORT=/tmp/tc-coverage-report.txt
          {
            echo "## TC Coverage Verification"
            echo ""
            if [ -s "$REPORT" ]; then
              echo '```'
              cat "$REPORT"
              echo '```'
            else
              echo "_Report not generated_"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # make test regenerates manifests; any diff means a generated file
      # (CRDs, RBAC, chart CRD template, deepcopy) was hand-edited or stale.
      - name: Verify generated files are up to date
        run: git diff --exit-code -- api config charts/pillar-csi/templates/crds.yaml

  csi-sanity:
    name: csi-sanity (in-process CSI conformance)
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Run csi-sanity
        # The required Test job retains the same untagged whole-repo vet.
        # Tagged go test still vets the sanity package on this runner.
        run: make test-csi-sanity CSI_SANITY_SKIP_VET=true

  chart:
    name: Helm chart render regression
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v4.3.0

      - name: Run chart render regression tests
        run: make test-chart

  e2e:
    name: E2E Tests (multi-node Kind)
    # Run on every push and pull_request (workflow-level triggers already set).
    # Skip if the commit message contains [skip e2e] or [e2e skip].
    # The job body lives in e2e-kind.yml so daily-e2e.yml runs the same suite.
    needs: [changes, runtime-images]
    if: |
      !cancelled() &&
      needs['runtime-images'].result == 'success' &&
      (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') &&
      !contains(github.event.head_commit.message, '[skip e2e]') &&
      !contains(github.event.head_commit.message, '[e2e skip]')
    permissions:
      contents: read
    uses: ./.github/workflows/e2e-kind.yml
    with:
      runtime_image_artifact: ${{ needs['runtime-images'].outputs.runtime_image_artifact }}
      runtime_image_tag: ${{ needs['runtime-images'].outputs.runtime_image_tag }}
      # The required Test job already runs vet through `make test`.
      skip_vet: true

  external-e2e:
    name: External Storage E2E
    needs: [changes, runtime-images]
    if: ${{ !cancelled() && needs['runtime-images'].result == 'success' && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    permissions:
      contents: read
    uses: ./.github/workflows/external-e2e.yml
    with:
      runtime_image_artifact: ${{ needs['runtime-images'].outputs.runtime_image_artifact }}
      runtime_image_tag: ${{ needs['runtime-images'].outputs.runtime_image_tag }}
      ginkgo_procs: 4
  e2e-bench:
    name: E2E Baseline Benchmark (≤120s)
    runs-on: ubuntu-latest
    needs: [changes]
    if: |
      !cancelled() &&
      (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') &&
      !contains(github.event.head_commit.message, '[skip e2e]') &&
      !contains(github.event.head_commit.message, '[e2e skip]')
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # go mod tidy ensures the module cache is warm before timing begins so
      # network latency does not inflate the wall-clock measurement.
      - name: Warm module cache
        run: go mod tidy

      # Go uses ~/.cache/go-build on the ubuntu-latest runner.
      - name: Restore Go test build cache
        id: go-build-cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/go-build
          key: e2e-bench-gocache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            e2e-bench-gocache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}-
            e2e-bench-gocache-${{ runner.os }}-${{ runner.arch }}-

      # Compile the benchmark packages before the timed command.  This keeps
      # the 120-second gate focused on test execution while the cache step
      # measures whether compiled objects are reusable across CI runs.
      - name: Warm test build cache
        id: warm-build
        run: |
          WARM_START=$(date +%s)
          set +e
          go test -run=^$ ./test/e2e/... 2>&1 | tee /tmp/e2e-build-cache-warm.log
          WARM_RC=${PIPESTATUS[0]}
          set -e
          WARM_ELAPSED=$(( $(date +%s) - WARM_START ))
          echo "elapsed=${WARM_ELAPSED}" >> "$GITHUB_OUTPUT"
          echo "::notice title=e2e-build-cache::Warm compile ${WARM_ELAPSED}s (cache-hit=${{ steps.go-build-cache.outputs.cache-hit }})"
          exit "${WARM_RC}"

      # Record the start timestamp so we can emit an independent wall-clock
      # measurement in the step summary even if make test-e2e-bench exits
      # non-zero (i.e. tests failed before the 120s limit was hit).
      - name: Run e2e baseline benchmark
        id: bench
        run: |
          BENCH_START=$(date +%s)
          make test-e2e-bench && BENCH_RC=0 || BENCH_RC=$?
          BENCH_ELAPSED=$(( $(date +%s) - BENCH_START ))
          echo "elapsed=${BENCH_ELAPSED}" >> "$GITHUB_OUTPUT"
          echo "::notice title=e2e-bench::Wall-clock ${BENCH_ELAPSED}s (limit 120s)"
          exit "${BENCH_RC}"

      # Always emit a step summary so the elapsed time is visible in the GHA
      # UI regardless of pass/fail.  The summary references the TC budget so
      # reviewers understand the threshold without consulting the Makefile.
      - name: Emit benchmark summary
        if: always()
        run: |
          ELAPSED="${{ steps.bench.outputs.elapsed }}"
          if [ -z "$ELAPSED" ]; then ELAPSED="unknown"; fi
          {
            echo "## E2E Baseline Benchmark"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| Wall-clock | ${ELAPSED}s |"
            echo "| Build-cache hit | ${{ steps.go-build-cache.outputs.cache-hit || 'false' }} |"
            echo "| Warm compile | ${{ steps.warm-build.outputs.elapsed || 'unknown' }}s |"
            echo "| Budget | 120s |"
            if [ "$ELAPSED" != "unknown" ] && [ "$ELAPSED" -gt 120 ] 2>/dev/null; then
              echo "| Status | ❌ EXCEEDED |"
            else
              echo "| Status | ✅ PASS |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    # Keep the existing job id/name because "Build (all platforms)" is a
    # required branch-protection check. Both lanes compile all eight platforms
    # with the canonical Dockerfile/toolchain and shared BuildKit cache.
    name: Build (all platforms)
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    env:
      PLATFORMS: linux/amd64,linux/amd64/v2,linux/amd64/v3,linux/arm64,linux/arm/v7,linux/s390x,linux/ppc64le,linux/riscv64
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Restore BuildKit cache mounts (read-only)
        if: ${{ github.event_name != 'push' || github.ref != 'refs/heads/master' }}
        id: cache-pr
        uses: actions/cache/restore@v6.1.0
        with:
          path: buildkit-cache
          key: buildkit-mount-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Dockerfile', 'go.mod', 'go.sum') }}
          restore-keys: |
            buildkit-mount-v2-${{ runner.os }}-${{ runner.arch }}-
            buildkit-mount-${{ hashFiles('Dockerfile') }}-

      - name: Restore and save BuildKit cache mounts (master)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        id: cache-master
        uses: actions/cache@v6.1.0
        with:
          path: buildkit-cache
          key: buildkit-mount-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Dockerfile', 'go.mod', 'go.sum') }}
          restore-keys: |
            buildkit-mount-v2-${{ runner.os }}-${{ runner.arch }}-
            buildkit-mount-${{ hashFiles('Dockerfile') }}-

      - name: Inject/extract BuildKit cache mounts
        uses: reproducible-containers/buildkit-cache-dance@v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-dir: buildkit-cache
          skip-extraction: ${{ github.event_name != 'push' || github.ref != 'refs/heads/master' || steps.cache-master.outputs.cache-hit == 'true' }}

      - name: Compile Go binaries for all supported Linux targets
        id: compile
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.image_contract != 'true' && !(github.event_name == 'push' && github.ref == 'refs/heads/master') }}
        uses: docker/bake-action@v7.4.0
        with:
          files: docker-bake.hcl
          targets: compile
          set: |
            compile.cache-from=type=gha,scope=pillar-ci-compile

      # Packaging remains separate from behavior validation. This job runs
      # beside the runtime-image job so E2E does not wait for the full matrix.
      - name: Build all images for all platforms
        id: full_images
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.image_contract == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/master') }}
        uses: docker/bake-action@v7.4.0
        with:
          files: docker-bake.hcl
          set: |
            controller.cache-from=type=gha,scope=pillar-ci-controller
            agent.cache-from=type=gha,scope=pillar-ci-agent
            node.cache-from=type=gha,scope=pillar-ci-node
            ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && 'controller.cache-to=type=gha,scope=pillar-ci-controller,mode=min' || '' }}
            ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && 'agent.cache-to=type=gha,scope=pillar-ci-agent,mode=min' || '' }}
            ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && 'node.cache-to=type=gha,scope=pillar-ci-node,mode=min' || '' }}

      - name: Emit build lane summary
        if: always()
        env:
          COMPILE_STATUS: ${{ steps.compile.conclusion || 'not run' }}
          FULL_IMAGE_CONTRACT: ${{ needs.changes.result != 'success' || needs.changes.outputs.image_contract == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/master') }}
          FULL_IMAGE_STATUS: ${{ steps.full_images.conclusion || 'not run' }}
        run: |
          {
            echo "## Build lanes"
            echo ""
            echo "| Lane | Status |"
            echo "|------|--------|"
            echo "| All-target Go compile | ${COMPILE_STATUS} |"
            if [ "${FULL_IMAGE_CONTRACT}" = "true" ]; then
              echo "| Full multi-platform OCI contract | ${FULL_IMAGE_STATUS} |"
            else
              echo "| Full multi-platform OCI contract | skipped for source-only change |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Build the exact checkout once for the behavior-validation lanes. This job
  # runs beside the required cross-platform compile/package job so E2E does not
  # wait for the platform compile or packaging matrix it does not consume.
  runtime-images:
    name: Build exact-checkout runtime images
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    outputs:
      runtime_image_artifact: ${{ steps.runtime_meta.outputs.artifact_name }}
      runtime_image_tag: ${{ steps.runtime_meta.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set exact-checkout runtime image metadata
        id: runtime_meta
        shell: bash
        run: |
          set -euo pipefail
          echo "artifact_name=pillar-csi-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "image_tag=ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4.4.1

      # Seed only the amd64 compiler cache here; importing the much larger
      # eight-platform cache would delay the two behavior-validation lanes.
      - name: Restore runtime compiler cache (read-only)
        if: ${{ github.event_name != 'push' || github.ref != 'refs/heads/master' }}
        uses: actions/cache/restore@v6.1.0
        with:
          path: runtime-buildkit-cache
          key: runtime-buildkit-mount-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Dockerfile', 'go.mod', 'go.sum') }}
          restore-keys: |
            runtime-buildkit-mount-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore and save runtime compiler cache (master)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        id: runtime-cache-master
        uses: actions/cache@v6.1.0
        with:
          path: runtime-buildkit-cache
          key: runtime-buildkit-mount-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Dockerfile', 'go.mod', 'go.sum') }}
          restore-keys: |
            runtime-buildkit-mount-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Inject/extract runtime compiler cache
        uses: reproducible-containers/buildkit-cache-dance@v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-dir: runtime-buildkit-cache
          skip-extraction: ${{ github.event_name != 'push' || github.ref != 'refs/heads/master' || steps.runtime-cache-master.outputs.cache-hit == 'true' }}

      - name: Build exact-checkout runtime images (amd64)
        env:
          REGISTRY: pillar-csi
          TAG: ${{ steps.runtime_meta.outputs.image_tag }}
        uses: docker/bake-action@v7.4.0
        with:
          files: docker-bake.hcl
          targets: controller,agent,node
          load: true
          set: |
            *.platform=linux/amd64
            *.cache-from=type=gha,scope=pillar-ci-runtime
            ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && '*.cache-to=type=gha,scope=pillar-ci-runtime,mode=min' || '' }}

      - name: Export exact-checkout runtime image artifact
        env:
          IMAGE_TAG: ${{ steps.runtime_meta.outputs.image_tag }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/runtime-images.tar"
          docker save -o "${archive}" \
            "pillar-csi/controller:${IMAGE_TAG}" \
            "pillar-csi/agent:${IMAGE_TAG}" \
            "pillar-csi/node:${IMAGE_TAG}"

          controller_id="$(docker image inspect --format '{{.Id}}' "pillar-csi/controller:${IMAGE_TAG}")"
          agent_id="$(docker image inspect --format '{{.Id}}' "pillar-csi/agent:${IMAGE_TAG}")"
          node_id="$(docker image inspect --format '{{.Id}}' "pillar-csi/node:${IMAGE_TAG}")"
          printf '{"source_sha":"%s","image_tag":"%s","images":{"controller":"%s","agent":"%s","node":"%s"}}\n' \
            "${SOURCE_SHA}" "${IMAGE_TAG}" "${controller_id}" "${agent_id}" "${node_id}" \
            > "${RUNNER_TEMP}/runtime-images.json"

      - name: Upload exact-checkout runtime images
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pillar-csi-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/runtime-images.tar
            ${{ runner.temp }}/runtime-images.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
