name: CI

on:
  push:
    branches: [master]
  pull_request:
  # MEASUREMENT-ONLY (controlled source-change replay srcab-20261001, variant A):
  # seed = BASE tree, exports caches like a master push; measure = SOURCE tree,
  # read-only caches like a pull request. Not a production PR run.
  workflow_dispatch:
    inputs:
      measure_role:
        description: seed (export caches) or measure (read-only caches)
        type: choice
        options: [seed, measure]
        required: true
      paths_base:
        description: Commit the change filter diffs against
        type: string
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── changes ────────────────────────────────────────────────────────────────
  # Detects docs-only changes so the heavy jobs below can be skipped for them.
  #
  # A workflow-level `paths-ignore` would not work here: Lint, Test, Build and
  # E2E are required status checks, and a workflow that never starts leaves
  # those checks pending, which blocks the pull request. A job skipped through
  # `if:` reports "skipped", which satisfies a required check.
  #
  # The gate fails closed: a heavy job is skipped only when this job succeeded
  # and reported no code change. If detection fails, every heavy job runs.
  # `!cancelled()` lets them start after a failed `changes` job, so jobs with
  # other prerequisites also check those results explicitly.
  #
  # `code` is true when any changed file lies outside site/** and **/*.md.
  # docs/E2E-TESTCASES.md is a test input (verify-tc-coverage and the e2e
  # catalog parse it), so it counts as code.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code == 'true' || steps.filter.outputs.tcspec == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          # MEASUREMENT-ONLY: diff the replay commit against the explicit
          # parent so overlay files never reach the change gate.
          base: ${{ inputs.paths_base }}
          predicate-quantifier: some-with-excludes
          filters: |
            code:
              - '**'
              - '!site/**'
              - '!**/*.md'
            tcspec:
              - 'docs/E2E-TESTCASES.md'

  # MEASUREMENT-ONLY: proves which application/test source this replay ran.
  measurement-provenance:
    name: Measurement provenance
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VARIANT: A
      MEASURE_ROLE: ${{ inputs.measure_role }}
      PATHS_BASE: ${{ inputs.paths_base }}
      BASE_REF: 5854c6895c179b1728423050344763db1a8423e3
      SOURCE_REF: a1547c5dc13fd291b92745438e5537d0633c6d69
      OVERLAY_FILES: >-
        .github/measure-cache-salt
        .github/workflows/ci.yml
        .github/workflows/e2e-kind.yml
        .github/workflows/external-e2e.yml
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify replay source provenance
        shell: bash
        run: |
          set -euo pipefail
          case "${MEASURE_ROLE}" in
            seed) app_ref="${BASE_REF}" ;;
            measure) app_ref="${SOURCE_REF}" ;;
            *) echo "unknown role ${MEASURE_ROLE}"; exit 1 ;;
          esac
          out="${RUNNER_TEMP}/provenance"
          mkdir -p "${out}"
          printf '%s\n' ${OVERLAY_FILES} | sort > "${out}/overlay-expected.txt"
          git diff --name-only "${app_ref}" HEAD | sort > "${out}/overlay-actual.txt"
          diff -u "${out}/overlay-expected.txt" "${out}/overlay-actual.txt"
          git diff --name-only "${PATHS_BASE}" HEAD | sort > "${out}/gate-diff.txt"
          if [ "${MEASURE_ROLE}" = measure ]; then
            git diff --name-only "${BASE_REF}" "${SOURCE_REF}" | sort > "${out}/source-diff-expected.txt"
            diff -u "${out}/source-diff-expected.txt" "${out}/gate-diff.txt"
          fi
          {
            echo "variant=${VARIANT} role=${MEASURE_ROLE} github_sha=${GITHUB_SHA} app_ref=${app_ref} paths_base=${PATHS_BASE}"
            echo "head_tree=$(git rev-parse 'HEAD^{tree}')"
            for p in api cmd internal proto gen config charts hack test docs/E2E-TESTCASES.md go.mod go.sum Dockerfile; do
              head_obj="$(git rev-parse "HEAD:${p}")"
              ref_obj="$(git rev-parse "${app_ref}:${p}")"
              echo "${p} head=${head_obj} app_ref=${ref_obj} equal=$([ "${head_obj}" = "${ref_obj}" ] && echo yes || echo no)"
            done
            echo "gate_diff_files=$(wc -l < "${out}/gate-diff.txt") gate_diff_go_nontest=$(grep '\.go$' "${out}/gate-diff.txt" | grep -vc '_test\.go$' || true)"
          } | tee "${out}/provenance.txt"
          for p in api cmd internal proto gen config charts go.mod go.sum Dockerfile; do
            [ "$(git rev-parse "HEAD:${p}")" = "$(git rev-parse "${app_ref}:${p}")" ]
          done
          { echo '## Measurement provenance (controlled replay)'; echo '```'; cat "${out}/provenance.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: measurement-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/provenance

  # ── docs ───────────────────────────────────────────────────────────────────
  # Generated reference docs must match api/v1alpha1 and the chart values, and
  # links in the README, CONTRIBUTING and site content must resolve.
  docs:
    name: Docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            .github/measure-cache-salt
          cache: true

      - name: Cache documentation tools
        uses: actions/cache@v6
        with:
          path: bin/
          key: measure-srcab1001-a-docs-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile', 'go.mod', 'go.sum') }}

      - name: Verify generated docs are up to date
        run: make docs-check

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config hack/docs/lychee.toml
            --root-dir ${{ github.workspace }}/site/src/content/docs
            README.md
            CONTRIBUTING.md
            'site/src/content/**/*.md'
            'site/src/content/**/*.mdx'

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            .github/measure-cache-salt

      - name: Run linter
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            .github/measure-cache-salt

      - name: Cache test tools
        uses: actions/cache@v6
        with:
          path: bin/
          key: measure-srcab1001-a-test-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile', 'go.mod', 'go.sum') }}

      - name: Run tests
        shell: bash
        run: |
          set +e
          make test 2>&1 | tee /tmp/make-test.log
          MAKE_RC=${PIPESTATUS[0]}
          set -e
          awk '
            /^=== TC Coverage Verification/ { capture=1 }
            capture { print }
            capture && /^=== done ===$/ { exit }
          ' /tmp/make-test.log > /tmp/tc-coverage-report.txt
          exit "${MAKE_RC}"

      - name: Emit coverage summary
        if: always()
        run: |
          REPORT=/tmp/tc-coverage-report.txt
          {
            echo "## TC Coverage Verification"
            echo ""
            if [ -s "$REPORT" ]; then
              echo '```'
              cat "$REPORT"
              echo '```'
            else
              echo "_Report not generated_"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # make test regenerates manifests; any diff means a generated file
      # (CRDs, RBAC, chart CRD template, deepcopy) was hand-edited or stale.
      - name: Verify generated files are up to date
        run: git diff --exit-code -- api config charts/pillar-csi/templates/crds.yaml

  csi-sanity:
    name: csi-sanity (in-process CSI conformance)
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            .github/measure-cache-salt

      - name: Run csi-sanity
        run: make test-csi-sanity

  chart:
    name: Helm chart render regression
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            .github/measure-cache-salt

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Run chart render regression tests
        run: make test-chart

  e2e:
    name: E2E Tests (multi-node Kind)
    # Run on every push and pull_request (workflow-level triggers already set).
    # Skip if the commit message contains [skip e2e] or [e2e skip].
    # The job body lives in e2e-kind.yml so daily-e2e.yml runs the same suite.
    needs: [changes]
    if: |
      !cancelled() &&
      (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') &&
      !contains(github.event.head_commit.message, '[skip e2e]') &&
      !contains(github.event.head_commit.message, '[e2e skip]')
    permissions:
      contents: read
    uses: ./.github/workflows/e2e-kind.yml

  external-e2e:
    name: External Storage E2E
    needs: [changes]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    permissions:
      contents: read
    uses: ./.github/workflows/external-e2e.yml

  # ── e2e-bench ──────────────────────────────────────────────────────────────
  # CI baseline benchmark job.
  #
  # Runs the in-process e2e suite (no -tags=e2e → no Kind cluster, no ZFS/LVM)
  # via `go test ./test/e2e/... -count=1` and fails the build if total
  # wall-clock time exceeds 120 seconds.
  #
  # This job acts as a canary: if a newly added spec or a shared setup change
  # causes the in-process suite to slow beyond the 2-minute budget the build
  # breaks immediately, before the heavier Kind-cluster jobs are scheduled.
  #
  # Skip with [skip e2e] or [e2e skip] in the commit message (same gate as
  # the full e2e job so that hotfixes bypass both in one flag).
  e2e-bench:
    name: E2E Baseline Benchmark (≤120s)
    runs-on: ubuntu-latest
    needs: [changes]
    if: |
      !cancelled() &&
      (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') &&
      !contains(github.event.head_commit.message, '[skip e2e]') &&
      !contains(github.event.head_commit.message, '[e2e skip]')
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            .github/measure-cache-salt
          cache: true

      # go mod tidy ensures the module cache is warm before timing begins so
      # network latency does not inflate the wall-clock measurement.
      - name: Warm module cache
        run: go mod tidy

      # Record the start timestamp so we can emit an independent wall-clock
      # measurement in the step summary even if make test-e2e-bench exits
      # non-zero (i.e. tests failed before the 120s limit was hit).
      - name: Run e2e baseline benchmark
        id: bench
        run: |
          BENCH_START=$(date +%s)
          make test-e2e-bench && BENCH_RC=0 || BENCH_RC=$?
          BENCH_ELAPSED=$(( $(date +%s) - BENCH_START ))
          echo "elapsed=${BENCH_ELAPSED}" >> "$GITHUB_OUTPUT"
          echo "::notice title=e2e-bench::Wall-clock ${BENCH_ELAPSED}s (limit 120s)"
          exit "${BENCH_RC}"

      # Always emit a step summary so the elapsed time is visible in the GHA
      # UI regardless of pass/fail.  The summary references the TC budget so
      # reviewers understand the threshold without consulting the Makefile.
      - name: Emit benchmark summary
        if: always()
        run: |
          ELAPSED="${{ steps.bench.outputs.elapsed }}"
          if [ -z "$ELAPSED" ]; then ELAPSED="unknown"; fi
          {
            echo "## E2E Baseline Benchmark"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| Wall-clock | ${ELAPSED}s |"
            echo "| Budget | 120s |"
            if [ "$ELAPSED" != "unknown" ] && [ "$ELAPSED" -gt 120 ] 2>/dev/null; then
              echo "| Status | ❌ EXCEEDED |"
            else
              echo "| Status | ✅ PASS |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build (all platforms)
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Restore BuildKit cache mounts (pull request)
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.measure_role == 'measure') }}
        id: cache-pr
        uses: actions/cache/restore@v6
        with:
          path: buildkit-cache
          key: measure-srcab1001-a-buildkit-mount-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Dockerfile', 'go.mod', 'go.sum') }}
          restore-keys: |
            measure-srcab1001-a-buildkit-mount-v2-${{ runner.os }}-${{ runner.arch }}-
            measure-srcab1001-a-buildkit-mount-${{ hashFiles('Dockerfile') }}-

      - name: Restore and save BuildKit cache mounts (master)
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') || (github.event_name == 'workflow_dispatch' && inputs.measure_role == 'seed') }}
        id: cache-master
        uses: actions/cache@v6
        with:
          path: buildkit-cache
          key: measure-srcab1001-a-buildkit-mount-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Dockerfile', 'go.mod', 'go.sum') }}
          restore-keys: |
            measure-srcab1001-a-buildkit-mount-v2-${{ runner.os }}-${{ runner.arch }}-
            measure-srcab1001-a-buildkit-mount-${{ hashFiles('Dockerfile') }}-

      - name: Inject/extract BuildKit cache mounts
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-dir: buildkit-cache
          skip-extraction: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.measure_role == 'measure') || steps.cache-master.outputs.cache-hit == 'true' }}

      - name: Build all images for all platforms
        uses: docker/bake-action@v7
        with:
          files: docker-bake.hcl
          set: |
            *.platform=linux/amd64,linux/amd64/v2,linux/amd64/v3,linux/arm64,linux/arm/v7,linux/s390x,linux/ppc64le,linux/riscv64
            controller.cache-from=type=gha,scope=measure-srcab1001-a-pillar-ci-controller
            agent.cache-from=type=gha,scope=measure-srcab1001-a-pillar-ci-agent
            node.cache-from=type=gha,scope=measure-srcab1001-a-pillar-ci-node
            ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/master') || (github.event_name == 'workflow_dispatch' && inputs.measure_role == 'seed')) && 'controller.cache-to=type=gha,scope=measure-srcab1001-a-pillar-ci-controller,mode=min' || '' }}
            ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/master') || (github.event_name == 'workflow_dispatch' && inputs.measure_role == 'seed')) && 'agent.cache-to=type=gha,scope=measure-srcab1001-a-pillar-ci-agent,mode=min' || '' }}
            ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/master') || (github.event_name == 'workflow_dispatch' && inputs.measure_role == 'seed')) && 'node.cache-to=type=gha,scope=measure-srcab1001-a-pillar-ci-node,mode=min' || '' }}
