# SIG-Storage External Storage e2e — runs upstream `e2e.test
# -storage.testdriver=external-driver.yaml` against a freshly bootstrapped
# Kind cluster with pillar-csi Helm-installed.  Exercised on every PR and
# master push so the in-cluster storage contract is gated alongside the
# in-process csi-sanity check.  A nightly schedule keeps the signal alive
# even when no PRs land.

name: External Storage E2E

on:
  pull_request: {}
  push:
    branches: [master]
  workflow_dispatch: {}
  schedule:
    - cron: '0 7 * * *'  # 07:00 UTC daily

permissions:
  contents: read

jobs:
  external-e2e:
    name: SIG-Storage External Storage e2e
    runs-on: ubuntu-latest
    # The pod-mount lifecycle specs each carry a 5-minute pod-running
    # deadline, and v1.36+ added a same-node expand-and-recreate scenario
    # that on a clean run takes ~18 minutes total.  45 minutes gives the
    # bootstrap (~4 min), the suite (~20 min on a slow runner), and the
    # post-failure diagnostic dump enough room before a stuck spec or a
    # flaky kubelet retry triggers the GitHub timeout (which cancels the
    # job before the dump step runs).
    timeout-minutes: 45
    env:
      KIND_VERSION: "v0.33.0"
      KIND_CLUSTER: "pillar-csi-ext-e2e"
      E2E_HELM_NAMESPACE: "pillar-csi-system"
      DOCKER_HOST: "unix:///var/run/docker.sock"
      # K8S_VERSION pin lets run.sh skip the dl.k8s.io stable.txt lookup so
      # the cached e2e.test bundle is shared across runs.
      K8S_VERSION: "v1.37.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Kind ${{ env.KIND_VERSION }}
        uses: helm/kind-action@v1
        with:
          install_only: true
          version: ${{ env.KIND_VERSION }}

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Install ZFS, LVM, and NVMe-oF kernel modules
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y zfsutils-linux lvm2 thin-provisioning-tools \
            linux-modules-extra-$(uname -r) || \
            sudo apt-get install -y zfsutils-linux lvm2 thin-provisioning-tools
          sudo modprobe zfs
          sudo modprobe dm_mod
          sudo modprobe dm_thin_pool
          sudo modprobe nvme_fabrics
          sudo modprobe nvmet
          sudo modprobe nvmet_tcp
          sudo modprobe nvme_tcp

      - name: Pre-pull base + sidecar images
        run: |
          docker pull alpine:3.24
          docker pull golang:1.27-alpine3.24
          docker pull busybox:1.38.0
          docker pull registry.k8s.io/sig-storage/csi-provisioner:v6.3.0
          docker pull registry.k8s.io/sig-storage/csi-attacher:v4.12.0
          docker pull registry.k8s.io/sig-storage/csi-resizer:v2.2.1
          docker pull registry.k8s.io/sig-storage/livenessprobe:v2.19.0
          docker pull registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.17.0

      - name: Bootstrap cluster + Helm-deploy pillar-csi
        env:
          CLUSTER_NAME: "${{ env.KIND_CLUSTER }}"
          HELM_NAMESPACE: "${{ env.E2E_HELM_NAMESPACE }}"
        run: ./test/external-e2e/bootstrap.sh

      - name: Run External Storage e2e
        env:
          KUBECONFIG: "/home/runner/.kube/config"
          E2E_FAIL_FAST: "1"
        run: make test-external-e2e

      - name: Dump cluster + kernel diagnostics on failure
        if: ${{ failure() || cancelled() }}
        env:
          KUBECONFIG: "/home/runner/.kube/config"
          NS: "${{ env.E2E_HELM_NAMESPACE }}"
          KIND_NODE: "${{ env.KIND_CLUSTER }}-control-plane"
        run: |
          echo "==== Pods in pillar-csi namespace ===="
          kubectl -n "${NS}" get pods -o wide || true
          echo
          echo "==== Recent events from all namespaces (sorted) ===="
          kubectl get events -A --sort-by=.lastTimestamp 2>/dev/null | tail -120 || true
          echo
          echo "==== Test pods still present (volume-* / provisioning-* / fsgroupchangepolicy-*) ===="
          for ns in $(kubectl get ns -o name 2>/dev/null | command grep -E "volume-|provisioning-|fsgroupchangepolicy-|exec-|subpath-|expand-|multi-"); do
            ns_name="${ns##namespace/}"
            kubectl -n "${ns_name}" get pods,pvc -o wide 2>/dev/null || true
            for pod in $(kubectl -n "${ns_name}" get pods -o name 2>/dev/null); do
              echo "--- describe ${ns_name}/${pod} (Status + Events) ---"
              kubectl -n "${ns_name}" describe "${pod}" 2>/dev/null | command grep -E "Status:|Phase:|Reason:|Message:|Events:|FailedMount|FailedUnmount|Killing|Unhealthy|Warning" -A1 || true
            done
          done
          echo
          echo "==== VolumeAttachment + CSINode state ===="
          kubectl get volumeattachment -o wide 2>/dev/null || true
          echo
          kubectl get csinodes -o yaml 2>/dev/null | command grep -E "name:|nodeID:|drivers:|topologyKeys:" | head -40 || true
          echo
          for pod in $(kubectl -n "${NS}" get pods -o name 2>/dev/null); do
            for ctr in $(kubectl -n "${NS}" get "${pod}" \
                -o jsonpath='{range .spec.containers[*]}{.name}{"\n"}{end}' 2>/dev/null); do
              echo "==== ${pod} container=${ctr} (last 500 lines) ===="
              kubectl -n "${NS}" logs --tail=500 "${pod}" -c "${ctr}" 2>/dev/null || true
              echo
            done
          done
          echo
          echo "==== kubelet log: NodeUnstage / NodeUnpublish / Unmount activity ===="
          docker exec "${KIND_NODE}" sh -c \
            "journalctl -u kubelet --no-pager 2>/dev/null | grep -iE 'pillar|nvme|unstag|unpublish|unmount|terminating' | tail -200" || true
          echo "==== PillarAgent / PillarStore / PillarProtocol ===="
          kubectl get pillaragents,pillarstores,pillarprotocols -o yaml 2>/dev/null || true
          echo
          echo "==== PVC / PV / VolumeAttachment ===="
          kubectl get pvc,pv,volumeattachment -A 2>/dev/null || true
          echo
          echo "==== Kind node: nvmet configfs (subsystems + namespaces enable state) ===="
          docker exec "${KIND_NODE}" sh -c '
            set -x
            ls /sys/kernel/config/nvmet/subsystems/ 2>/dev/null || true
            for sub in /sys/kernel/config/nvmet/subsystems/*/; do
              echo "--- ${sub}"
              cat "${sub}attr_allow_any_host" 2>/dev/null || true
              ls "${sub}allowed_hosts/" 2>/dev/null || true
              for ns in "${sub}namespaces/"*/; do
                echo "  namespace ${ns}"
                cat "${ns}device_path" 2>/dev/null || true
                cat "${ns}enable" 2>/dev/null || true
              done
            done
            echo "--- ports"
            ls /sys/kernel/config/nvmet/ports/ 2>/dev/null || true
            for port in /sys/kernel/config/nvmet/ports/*/; do
              echo "  port ${port}"
              cat "${port}addr_traddr" 2>/dev/null || true
              cat "${port}addr_trsvcid" 2>/dev/null || true
              cat "${port}addr_trtype" 2>/dev/null || true
              ls "${port}subsystems/" 2>/dev/null || true
            done
            echo "--- hosts"
            ls /sys/kernel/config/nvmet/hosts/ 2>/dev/null || true
          ' || true
          echo
          echo "==== Kind node: sysfs nvme initiator side ===="
          docker exec "${KIND_NODE}" sh -c '
            set -x
            ls /sys/class/nvme/ 2>/dev/null || true
            ls /sys/class/nvme-subsystem/ 2>/dev/null || true
            for sub in /sys/class/nvme-subsystem/*/; do
              echo "--- ${sub}"
              cat "${sub}subsysnqn" 2>/dev/null || true
              ls "${sub}" 2>/dev/null || true
            done
            for c in /sys/class/nvme/nvme*; do
              echo "--- controller ${c}"
              cat "${c}/subsysnqn" 2>/dev/null || true
              cat "${c}/state" 2>/dev/null || true
              cat "${c}/address" 2>/dev/null || true
              ls "${c}" 2>/dev/null || true
            done
            ls /dev/nvme* 2>/dev/null || true
          ' || true
          echo
          echo "==== Kind node: kernel ring buffer (nvme + nvmet only, last 200 lines) ===="
          docker exec "${KIND_NODE}" sh -c \
            "dmesg 2>/dev/null | grep -iE 'nvme|nvmet' | tail -200" || true

      - name: Teardown Kind cluster
        if: always()
        run: |
          kind delete cluster --name "${KIND_CLUSTER}" || true
