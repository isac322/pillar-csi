// AgentService is the gRPC API that pillar-controller calls on each
// pillar-agent instance (one per storage node).  The controller is the sole
// source of truth and re-drives the agent to the desired state after any
// restart or crash.  The agent keeps exactly one piece of durable state: a
// per-volume fencing mark (see FencingToken) persisted on the node's local
// disk, so that a stale controller cannot create, expand, export, grant,
// revoke, unexport, or delete anything after a newer controller operation
// superseded it.
//
// Volume lifecycle from the controller's perspective:
//
//   CreateVolume (CSI)
//     ├─ CreateVolume(RPC)  — backend: create zvol / LV / …
//     └─ ExportVolume(RPC)  — protocol target: export over NVMe-oF / iSCSI / NFS
//
//   ControllerPublishVolume (CSI)
//     └─ AllowInitiator(RPC) — add initiator NQN/IQN/IP to ACL
//
//   ControllerUnpublishVolume (CSI)
//     └─ DenyInitiator(RPC)  — remove initiator from ACL
//
//   DeleteVolume (CSI)
//     ├─ UnexportVolume(RPC) — unexport: tear down protocol target entry
//     └─ DeleteVolume(RPC)   — backend: destroy zvol / LV / …
//
//   Cross-node migration / backup (out-of-band, not part of CSI spec)
//     ├─ SendVolume(RPC)    — server-stream: zfs send / dd out of volume
//     └─ ReceiveVolume(RPC) — client-stream: zfs receive / dd into volume

syntax = "proto3";

package pillar_csi.agent.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/isac322/pillar-csi/gen/go/pillar_csi/agent/v1;agentv1";

// FencingToken orders every mutation of one volume's resources.
//
// volume_uid is the UID of the volume's PillarVolumeState and identifies one
// lifecycle of the volume ID (a deleted and re-created volume with the same
// name has a new UID).  generation is the value of
// PillarVolumeState.status.publicationGeneration committed by the controller
// for the operation.  Every mutating request must carry a token.  The agent
// keeps a durable per-volume mark (uid, generation, ended, retired uids) and,
// under one per-volume lock that also covers the mutation, rejects a request
// with FAILED_PRECONDITION when:
//   - the token is missing or its volume_uid is empty;
//   - the uid is a retired lifecycle of the volume ID;
//   - the uid equals the mark's and the generation is lower;
//   - the uid equals the mark's, the lifecycle has ended (backend deleted),
//     and the request would create or grant anything, or is a revoke or
//     delete at a different generation;
//   - the uid differs and the mark's lifecycle has not ended.
// A different uid whose predecessor has ended starts a new lifecycle.
message FencingToken {
  string volume_uid = 1;
  uint64 generation = 2;
}

// ─────────────────────────────────────────────────────────────────────────────
// Service
// ─────────────────────────────────────────────────────────────────────────────

// AgentService is implemented by pillar-agent (gRPC server, storage node) and
// called by pillar-controller (gRPC client, Kubernetes cluster).
//
// All RPCs are idempotent — the controller may safely retry on any transient
// error.
service AgentService {
  // ── Discovery ─────────────────────────────────────────────────────────────

  // GetCapabilities returns the backend types and network protocols that this
  // agent supports.  Called during PillarAgent reconciliation to populate
  // status.capabilities and status.discoveredPools.
  rpc GetCapabilities(GetCapabilitiesRequest) returns (GetCapabilitiesResponse);

  // GetCapacity returns the current storage capacity of a specific pool.
  // Used to populate PillarStore.status.capacity.
  rpc GetCapacity(GetCapacityRequest) returns (GetCapacityResponse);

  // ListVolumes returns all volumes (backend resources) currently known by the
  // agent for a given pool.  Used for drift detection and recovery push.
  rpc ListVolumes(ListVolumesRequest) returns (ListVolumesResponse);

  // ListExports returns all currently active network exports (protocol target
  // entries) for a given pool.  Paired with ListVolumes for full state audit.
  rpc ListExports(ListExportsRequest) returns (ListExportsResponse);

  // HealthCheck returns the liveness and readiness status of the agent process
  // and its subsystems (ZFS kernel module, NVMe-oF configfs, etc.).
  // The controller uses this RPC to gate reconciliation and update
  // PillarAgent.status.conditions.
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);

  // ── Volume backend lifecycle ───────────────────────────────────────────────

  // CreateVolume creates the backend storage resource (e.g. ZFS zvol, LVM LV)
  // on the storage node.  This is the first step in the CreateVolume flow.
  //
  // Idempotent: if the volume already exists with the same parameters the
  // agent MUST return success.
  rpc CreateVolume(CreateVolumeRequest) returns (CreateVolumeResponse);

  // ImportVolume adopts an already-existing backend storage resource into a
  // volume lifecycle instead of creating one.  It backs the CSI CreateVolume
  // path of a PersistentVolumeClaim that carries the
  // "pillar-csi.bhyoo.com/import-zvol" or "pillar-csi.bhyoo.com/import-lv"
  // annotation.
  //
  // Import is strictly read-only on the backend: the agent MUST refuse
  // (FAILED_PRECONDITION or INVALID_ARGUMENT) when the resolved volume_id
  // does not name an existing resource of the backend's volume type inside
  // its configured layout, when that resource is still in use on the storage
  // node (a target backstore, an nvmet namespace, a mount or an exclusive
  // device claim), or when capacity_bytes exceeds the resource's current
  // size.  It must never create or modify the resource.  ZFS zvol and LVM
  // backends implement it; other backends return UNIMPLEMENTED.
  //
  // LVM imports require expected_lvm_source and are pinned durably to that
  // identity and to preserve_original: a later import of the same volume_id
  // naming a different source, or downgrading a preserving adoption, is
  // refused with FAILED_PRECONDITION.
  //
  // Idempotent: repeated calls for the same volume_id return the same
  // device path and capacity.  The request is fenced like CreateVolume.
  rpc ImportVolume(ImportVolumeRequest) returns (ImportVolumeResponse);

  // InspectVolume reports what the storage node observes about a backend
  // resource and the agent's own record of it: LVM identity and layout,
  // filesystem signature, local consumers, the agent's configured exports
  // and the durable fence mark (including a pinned import source).
  //
  // Strictly read-only and unfenced: it never activates, mounts, modifies or
  // persists anything, never compares or admits a lifecycle, and never
  // infers ownership.  Only BACKEND_TYPE_LVM is supported; other backends
  // return UNIMPLEMENTED.  A corrupt fence mark returns INTERNAL.
  rpc InspectVolume(InspectVolumeRequest) returns (InspectVolumeResponse);

  // DeleteVolume destroys the backend storage resource.  The export MUST have
  // been removed (UnexportVolume) before calling this RPC; the agent will
  // return FAILED_PRECONDITION otherwise.
  //
  // Idempotent: if the volume does not exist, the agent MUST return success.
  rpc DeleteVolume(DeleteVolumeRequest) returns (DeleteVolumeResponse);

  // ExpandVolume resizes the backend storage resource to at least
  // requested_bytes.  The agent returns the actual allocated size.
  rpc ExpandVolume(ExpandVolumeRequest) returns (ExpandVolumeResponse);

  // ReleaseVolume ends a volume lifecycle's ownership of volume_id without
  // touching the backend resource.  It retires a lifecycle whose backend
  // volume it must not destroy — an import that was never durably adopted —
  // so the pre-existing resource is never destroyed, resized or modified.
  //
  // When the fence's lifecycle owns the volume ID, the agent removes the
  // lifecycle's network export (like UnexportVolume) and records the
  // lifecycle as ended.  When another lifecycle owns it, or no lifecycle
  // does, the agent only records the fence's lifecycle as retired and leaves
  // the other lifecycle's resources untouched.  Afterwards every mutating
  // request carrying the released lifecycle's token (including a delayed
  // ImportVolume) is rejected with FAILED_PRECONDITION, while a new
  // lifecycle may still import or create the volume ID.
  //
  // Idempotent: releasing an already released lifecycle returns success.
  rpc ReleaseVolume(ReleaseVolumeRequest) returns (ReleaseVolumeResponse);

  // ── Ownership recovery ────────────────────────────────────────────────────

  // TransferVolumeOwnership atomically transfers ownership of an adopted
  // backend resource from a retired lifecycle to a new one.  It is the
  // recovery path for a PillarVolumeState that was adopted (ImportVolume)
  // but whose controller record was lost before the adoption was durable:
  // instead of deleting the pre-existing resource, an operator-authorised
  // transfer moves the durable fence mark to the new lifecycle.
  //
  // The request carries no FencingToken: authority is cryptographic, not
  // caller-asserted.  The agent accepts the transfer only when ALL of:
  //   - snapshot.signature verifies under the agent's own configured server
  //     TLS identity (the snapshot is self-attestation produced while the
  //     agent was healthy — never an mTLS peer assertion);
  //   - authorization.signature verifies under an operator public key from
  //     the configured --recovery-trust-anchor file, is within
  //     issued_at/expires_at, and its snapshot_digest equals the digest of
  //     the presented snapshot;
  //   - the mark's current uid/generation equal old_volume_uid/old_generation
  //     exactly and the mark's pinned LVM source equals lvm_source;
  //   - under the per-volume lock the device is provably idle (no exports,
  //     no ACL entries, no local consumers, O_EXCL claim free) — a stale or
  //     replayed snapshot cannot override a live observation;
  //   - authorization.new_volume_uid/new_generation differ from every
  //     lifecycle already recorded in the mark.
  //
  // One atomic mark write then records the new uid/generation, retires the
  // old uid, and pins the preserve policy and the authorization digest.
  // If the rename/fsync outcome is uncertain the agent returns
  // TRANSFER_OUTCOME_UNKNOWN and performs no rollback.  Retrying the exact
  // same snapshot+authorization is idempotent; retrying with a different
  // destination uid/generation or a different digest is refused with
  // FAILED_PRECONDITION.  When no --recovery-trust-anchor is configured the
  // agent fails closed with UNAVAILABLE.
  rpc TransferVolumeOwnership(TransferVolumeOwnershipRequest) returns (TransferVolumeOwnershipResponse);

  // ── Protocol target (export) lifecycle ────────────────────────────────────

  // ExportVolume creates the network-protocol target entry that exposes the
  // already-created volume to the network (e.g. adds an NVMe-oF subsystem +
  // namespace, or an iSCSI LUN, or an NFS export).
  //
  // Idempotent: if the export already exists with the same parameters the
  // agent MUST return the existing ExportInfo and success.
  rpc ExportVolume(ExportVolumeRequest) returns (ExportVolumeResponse);

  // UnexportVolume removes the network-protocol target entry (e.g. deletes the
  // NVMe-oF subsystem or unexports the NFS path).  Initiator ACL entries are
  // removed automatically.
  //
  // Idempotent: if the export does not exist, the agent MUST return success.
  rpc UnexportVolume(UnexportVolumeRequest) returns (UnexportVolumeResponse);

  // ── Initiator access control ───────────────────────────────────────────────

  // AllowInitiator grants network access to a single initiator for an already-
  // exported volume.  Corresponds to CSI ControllerPublishVolume.
  //
  // The meaning of initiator_id depends on the protocol:
  //   NVMe-oF TCP → host NQN   (added to allowed_hosts)
  //   iSCSI       → IQN        (added to LIO ACL)
  //   NFS         → client IP  (added to /etc/exports client list)
  //
  // Idempotent: if the ACL entry already exists the agent MUST return success.
  rpc AllowInitiator(AllowInitiatorRequest) returns (AllowInitiatorResponse);

  // DenyInitiator revokes network access for a single initiator.  Corresponds
  // to CSI ControllerUnpublishVolume.
  //
  // Idempotent: if the ACL entry does not exist the agent MUST return success.
  rpc DenyInitiator(DenyInitiatorRequest) returns (DenyInitiatorResponse);

  // SetLocalAttach switches a volume's network export between serving remote
  // initiators and being fenced for a direct attach on the storage node
  // itself.  Corresponds to CSI ControllerPublishVolume when the publishing
  // node is the storage node (local = true) or when a later publish goes to
  // a remote node after a local attach (local = false).
  //
  // local = true:  the agent stops the export from serving I/O to every
  //                remote initiator (NVMe-oF TCP: namespace enable = 0) and
  //                returns the backend device path the storage node mounts.
  // local = false: the agent refuses with FAILED_PRECONDITION while the
  //                backend device is still held exclusively on the storage
  //                node (a local mount or device-mapper claim is still
  //                present), and otherwise re-enables the export.
  //
  // Idempotent in both directions.
  rpc SetLocalAttach(SetLocalAttachRequest) returns (SetLocalAttachResponse);

  // ── Volume data migration ──────────────────────────────────────────────────

  // SendVolume streams the raw binary content of a backend volume to the
  // caller.  Intended for cross-node volume migration and offline backup.
  // The canonical implementation for ZFS backends is `zfs send`; for LVM it
  // is `dd if=<lv>`.
  //
  // The volume SHOULD be quiesced (UnexportVolume called) before streaming to
  // avoid data inconsistency.  The controller is responsible for quiescing.
  //
  // The response is a server-side stream of SendVolumeChunk messages.  The
  // first chunk (sequence == 0) carries the total_bytes field; subsequent
  // chunks carry only data and sequence.  The final chunk sets eof = true.
  rpc SendVolume(SendVolumeRequest) returns (stream SendVolumeChunk);

  // ReceiveVolume receives a binary data stream from the caller and writes it
  // into a pre-existing backend volume.  The mirror operation of SendVolume.
  // The canonical implementation for ZFS backends is `zfs receive`; for LVM
  // it is `dd of=<lv>`.
  //
  // The destination volume MUST already exist (CreateVolume) and MUST NOT be
  // exported (UnexportVolume must have been called) when this RPC is invoked.
  //
  // The request is a client-side stream of ReceiveVolumeChunk messages.  The
  // first chunk (sequence == 0) carries volume_id and backend_type; subsequent
  // chunks carry only data and sequence.  The final chunk sets eof = true.
  rpc ReceiveVolume(stream ReceiveVolumeChunk) returns (ReceiveVolumeResponse);

  // ── State recovery ─────────────────────────────────────────────────────────

  // ReconcileState converges the listed volumes to their desired exports and
  // ACLs.  The controller calls it level-triggered for every provisioned
  // volume (on volume/agent changes and periodically), so configfs state lost
  // to an agent restart, node reboot, or nvmet reload is re-created without a
  // dedicated restart signal.  Each volume carries its fencing token, so a
  // stale controller's reconcile is rejected per volume.  The agent returns
  // per-item results.
  //
  // The agent MUST NOT return an error if configfs entries already exist — it
  // reconciles to the desired state.  Targets of volumes that are not listed
  // are never modified.
  //
  // Export restore after a process start: every subsystem of a storage node
  // shares a few NVMe/TCP ports, and nvmet starts listening on a port when the
  // first subsystem is linked to it.  A host that reconnects to a listening
  // port for a subsystem that is not linked yet (or not fully configured) is
  // rejected with a do-not-retry status and deletes its controller.  The agent
  // therefore starts with HealthCheckResponse.export_restore_pending set and
  // rejects export-creating RPCs (ExportVolume, AllowInitiator, and a
  // ReconcileState without complete) with UNAVAILABLE until it has processed
  // a request with complete=true.  For every request the agent first
  // configures every listed export fully (subsystem, ACL, namespace identity,
  // enabled namespace) and only then links them to their ports.
  rpc ReconcileState(ReconcileStateRequest) returns (ReconcileStateResponse);

  // ── Lifecycle ─────────────────────────────────────────────────────────────

  // Drain stops the agent from accepting new mutating RPCs and waits until
  // all in-flight per-target operations have released their locks.  After
  // Drain returns successfully the agent persists a state-flush marker so
  // the next restart can detect a clean shutdown.
  //
  // Idempotent: subsequent calls return was_already_drained=true and do not
  // re-block; they are safe to invoke from a preStop hook that may run more
  // than once.
  //
  // Once drained the agent will reject every other RPC with code
  // UNAVAILABLE until the process is restarted; Drain itself is always
  // accepted so that orchestrators can confirm the drained state.
  rpc Drain(DrainRequest) returns (DrainResponse);
}

// ─────────────────────────────────────────────────────────────────────────────
// Shared types
// ─────────────────────────────────────────────────────────────────────────────

// BackendType enumerates the storage backend implementations.
enum BackendType {
  BACKEND_TYPE_UNSPECIFIED = 0;
  // ZFS zvol (block device at /dev/zvol/pool/name).
  BACKEND_TYPE_ZFS_ZVOL = 1;
  // ZFS dataset (filesystem mount point).
  BACKEND_TYPE_ZFS_DATASET = 2;
  // LVM logical volume.
  BACKEND_TYPE_LVM = 3;
  // Pre-existing raw block device.
  BACKEND_TYPE_BLOCK_DEVICE = 4;
  // Pre-existing local directory.
  BACKEND_TYPE_DIRECTORY = 5;
}

// ProtocolType enumerates the network storage protocols.
enum ProtocolType {
  PROTOCOL_TYPE_UNSPECIFIED = 0;
  // NVMe over Fabrics / TCP (configfs /sys/kernel/config/nvmet/).
  PROTOCOL_TYPE_NVMEOF_TCP = 1;
  // iSCSI via Linux LIO (configfs /sys/kernel/config/target/iscsi/).
  PROTOCOL_TYPE_ISCSI = 2;
  // NFS v4 (kernel nfsd + /etc/exports).
  PROTOCOL_TYPE_NFS = 3;
  // SMB/CIFS (Samba).
  PROTOCOL_TYPE_SMB = 4;
}

// VolumeCapability describes what the CSI consumer will do with the volume.
enum VolumeAccessType {
  VOLUME_ACCESS_TYPE_UNSPECIFIED = 0;
  // Raw block device.
  VOLUME_ACCESS_TYPE_BLOCK = 1;
  // Mounted filesystem.
  VOLUME_ACCESS_TYPE_MOUNT = 2;
}

// ZfsVolumeParams holds ZFS-specific creation parameters.  All string fields
// map directly to ZFS properties; unknown keys are forwarded as-is to zfs(8).
message ZfsVolumeParams {
  // The ZFS pool (e.g. "hot-data").  When non-empty it must equal the pool
  // of the agent backend that owns the volume.
  string pool = 1;
  // Parent dataset under which the volume is created (e.g. "k8s"), as
  // declared by the PillarStore.  The agent does not relocate volumes: it
  // rejects CreateVolume with FAILED_PRECONDITION unless this equals the
  // parent dataset its backend for the pool was started with (empty means the
  // pool root dataset).
  string parent_dataset = 2;
  // ZFS properties to set at creation time.
  // Example: {"compression": "lz4", "volblocksize": "8K"}.
  map<string, string> properties = 3;
}

// LvmVolumeParams holds LVM-specific creation parameters.
message LvmVolumeParams {
  // LVM volume group name.
  string volume_group = 1;
  // Additional lvcreate flags, e.g. "--type thin".
  repeated string extra_flags = 2;
  // provision_mode overrides the backend-level provisioning mode for this
  // individual volume.  Accepted values: "linear" (fully-allocated LV in the
  // VG) or "thin" (thin-provisioned LV inside the backend's thin pool).
  // An empty string (the default) means "use the backend default", i.e. the
  // agent config's lvm.provisioningMode (linear unless set).
  string provision_mode = 3;
  // thin_pool is the thin pool LV declared by the PillarStore (empty: the
  // store declares none).  When set, the agent rejects CreateVolume with
  // FAILED_PRECONDITION unless it equals the thin pool its backend for the
  // VG was started with.  Unset (a caller that does not declare a thin pool)
  // skips the check.
  optional string thin_pool = 4;
}

// BackendParams is a oneof wrapper for backend-specific creation parameters.
message BackendParams {
  oneof params {
    ZfsVolumeParams zfs = 1;
    LvmVolumeParams lvm = 2;
  }
}

// NvmeofTcpExportParams holds NVMe-oF TCP target configuration.
message NvmeofTcpExportParams {
  // IP address the NVMe-oF target will listen on.
  // Resolved by the controller from PillarAgent.spec.nodeRef at runtime.
  string bind_address = 1;
  // TCP port (default: 4420).
  int32 port = 2;
  // Not used by the agent: the I/O queue depth is requested by the
  // initiator (fabrics queue_size connect option), not configured on the
  // target port.
  int32 max_queue_size = 3;
  // In-capsule data size in bytes, applied as the nvmet port's
  // param_inline_data_size; 0 means not set.  A set value must be at least
  // 1024, the size of the fabrics Connect data every NVMe/TCP host sends
  // in-capsule.  The port is shared by every volume exported on the same
  // bind_address and port, and the kernel accepts the attribute only while
  // no subsystem is linked to the port.  When set, ExportVolume writes it to
  // a port without linked subsystems, and fails with FAILED_PRECONDITION
  // when the port already serves other volumes with a different value.  When
  // not set, a port without linked subsystems is reset to the transport
  // default and an active port is used as is.
  int32 in_capsule_data_size = 4;
  // Maximum data transfer size in bytes the target may advertise to hosts
  // at most (Identify Controller MDTS), applied as the nvmet port's
  // param_mdts.  0 means no limit; any other value is a power of two of at
  // least 8192 (param_mdts holds log2(size / 4096), and its value 0 means
  // no limit).  Unset (a controller that predates the field) accepts the
  // port's value.  Like in_capsule_data_size the value belongs to the port
  // shared by every volume exported on the same bind_address and port and
  // can change only while no subsystem is linked to it: ExportVolume writes
  // it to a port without linked subsystems and fails with
  // FAILED_PRECONDITION only when the port already advertises a larger
  // non-zero limit; a smaller one only makes commands smaller.
  // ReconcileState sets an idle port to the smallest non-zero value among
  // the exports it restores on the port.  A kernel without param_mdts
  // (Linux < 7.1) cannot advertise a limit; the export then proceeds and
  // hosts cap their own request size.
  optional int32 max_data_transfer_size = 5;
}

// IscsiExportParams holds iSCSI LIO target configuration.
message IscsiExportParams {
  // IP address the iSCSI target will listen on.
  string bind_address = 1;
  // TCP port (default: 3260).
  int32 port = 2;
  // CHAP credentials the target enforces on every initiator ACL of this
  // export.  Unset means no authentication (AuthMethod=None).
  IscsiChap chap = 3;
}

// IscsiChap carries iSCSI CHAP secrets (RFC 7143 §12.1.3).  username and
// password authenticate the initiator to the target.  mutual_username and
// mutual_password, when both set, authenticate the target to the initiator
// (mutual CHAP).  These are secrets: never log them.
message IscsiChap {
  string username = 1;
  string password = 2;
  string mutual_username = 3;
  string mutual_password = 4;
}

// NfsExportParams holds NFS export configuration.
message NfsExportParams {
  // NFS protocol version, e.g. "4.2".
  string version = 1;
  // IP address on which the NFS server listens.
  string bind_address = 2;
  // Identity squashing policy: "root", "none", or "all".
  string squash = 3;
  // Whether every client is served read-only.
  bool readonly = 4;
}

// SmbExportParams holds SMB/CIFS export configuration.
message SmbExportParams {
  // Share name used in the UNC path.
  string share_name = 1;
}

// ExportParams is a oneof wrapper for protocol-specific export parameters.
message ExportParams {
  oneof params {
    NvmeofTcpExportParams nvmeof_tcp = 1;
    IscsiExportParams iscsi = 2;
    NfsExportParams nfs = 3;
    SmbExportParams smb = 4;
  }
}

// ExportInfo describes an active network export and is stored by the
// controller in the PersistentVolume.spec.csi.volumeAttributes so that
// pillar-node can connect to the volume during NodeStageVolume.
message ExportInfo {
  // Protocol-specific connection string:
  //   NVMe-oF TCP → NQN of the subsystem
  //   iSCSI       → IQN of the target
  //   NFS         → exported path
  //   SMB         → UNC path (\\server\share)
  string target_id = 1;
  // IP address of the storage node (resolved from PillarAgent).
  string address = 2;
  // Port the protocol target is listening on.
  int32 port = 3;
  // Protocol-specific namespace / LUN / path identifier.
  // NVMe-oF: namespace ID (uint32 as string)
  // iSCSI:   LUN number (uint32 as string)
  // NFS:     export path
  string volume_ref = 4;
}

// VolumeInfo summarises a backend volume for list / audit purposes.
message VolumeInfo {
  // Unique volume identifier within the agent: "<pool>/<volume-name>".
  string volume_id = 1;
  // Actual allocated size in bytes.
  int64 capacity_bytes = 2;
  // Path to the volume on the storage node.
  //   ZFS zvol  → /dev/zvol/<pool>/<name>
  //   LVM LV    → /dev/<vg>/<lv>
  //   Directory → /path/to/dir
  string device_path = 3;
  // True if a network export (ExportVolume) has been applied to this volume.
  bool exported = 4;
}

// PoolInfo summarises a storage pool discovered by the agent.
message PoolInfo {
  // Pool name as understood by the backend (e.g. ZFS pool name).
  string name = 1;
  // Backend type of this pool.
  BackendType backend_type = 2;
  // Total capacity in bytes.
  int64 total_bytes = 3;
  // Available (free) capacity in bytes.
  int64 available_bytes = 4;
  // ZFS backends: the parent dataset (relative to the pool) under which the
  // agent creates volumes; empty means the pool root dataset.
  string parent_dataset = 5;
  // LVM backends: the thin pool LV the agent creates thin volumes in; empty
  // means the backend has no thin pool (linear LVs only).
  string thin_pool = 6;
}

// ─────────────────────────────────────────────────────────────────────────────
// GetCapabilities
// ─────────────────────────────────────────────────────────────────────────────

message GetCapabilitiesRequest {}

message GetCapabilitiesResponse {
  // Agent binary version string (semver).
  string agent_version = 1;
  // Backend types available on this node.
  // A backend is absent if its kernel module / userspace tool failed to load.
  repeated BackendType supported_backends = 2;
  // Network protocols available on this node.
  // A protocol is absent if its kernel module failed to load.
  repeated ProtocolType supported_protocols = 3;
  // Storage pools discovered by the agent.
  repeated PoolInfo discovered_pools = 4;
}

// ─────────────────────────────────────────────────────────────────────────────
// GetCapacity
// ─────────────────────────────────────────────────────────────────────────────

message GetCapacityRequest {
  // Backend type to query.
  BackendType backend_type = 1;
  // Pool name within the backend (e.g. ZFS pool name).
  string pool_name = 2;
}

message GetCapacityResponse {
  // Total capacity of the pool in bytes.
  int64 total_bytes = 1;
  // Available (free) capacity in bytes.
  int64 available_bytes = 2;
  // Used capacity in bytes.
  int64 used_bytes = 3;
}

// ─────────────────────────────────────────────────────────────────────────────
// ListVolumes
// ─────────────────────────────────────────────────────────────────────────────

message ListVolumesRequest {
  // Backend type to query.
  BackendType backend_type = 1;
  // Pool name to list volumes from.
  string pool_name = 2;
}

message ListVolumesResponse {
  repeated VolumeInfo volumes = 1;
}

// ─────────────────────────────────────────────────────────────────────────────
// ListExports
// ─────────────────────────────────────────────────────────────────────────────

message ListExportsRequest {
  // Protocol type to query.
  ProtocolType protocol_type = 1;
}

message ListExportsResponse {
  // volume_id → ExportInfo for every active export of the given protocol.
  map<string, ExportInfo> exports = 1;
}

// ─────────────────────────────────────────────────────────────────────────────
// HealthCheck
// ─────────────────────────────────────────────────────────────────────────────

// SubsystemStatus reports the health of a single agent subsystem.
message SubsystemStatus {
  // Human-readable name of the subsystem (e.g. "zfs", "nvmet-configfs").
  string name = 1;
  // True if the subsystem is operational.
  bool healthy = 2;
  // Human-readable message (e.g. "zfs module loaded" or error description).
  string message = 3;
}

message HealthCheckRequest {}

message HealthCheckResponse {
  // Overall health: true only when all subsystems are healthy.
  bool healthy = 1;
  // Per-subsystem health details.
  repeated SubsystemStatus subsystems = 2;
  // Agent binary version string (semver).
  string agent_version = 3;
  // Timestamp at which this health snapshot was taken by the agent.
  google.protobuf.Timestamp checked_at = 4;
  // True from agent start until the agent has processed a ReconcileState with
  // complete=true.  While set, the agent links no subsystem to a port on its
  // own and rejects export-creating RPCs; the controller must send the
  // complete desired export state of this agent in one ReconcileState.
  bool export_restore_pending = 5;
}

// ─────────────────────────────────────────────────────────────────────────────
// CreateVolume — create backend storage resource
// ─────────────────────────────────────────────────────────────────────────────

// CreateVolumeRequest asks the agent to create a backend storage resource.
message CreateVolumeRequest {
  // Unique volume identifier within the agent: "<pool>/<volume-name>".
  // Example: "hot-data/pvc-abc123"
  string volume_id = 1;

  // Requested storage size in bytes.
  int64 capacity_bytes = 2;

  // Backend implementation to use.
  BackendType backend_type = 3;

  // Backend-specific creation parameters (ZFS, LVM, …).
  BackendParams backend_params = 4;

  // Whether the volume will be used as raw block or mounted filesystem.
  // Filesystem backends (ZFS dataset, directory) must be MOUNT.
  // Block backends (zvol, LVM, block-device) can be either BLOCK or MOUNT.
  VolumeAccessType access_type = 5;

  // Fencing token: the PillarVolumeState UID and the publicationGeneration
  // the controller committed for this operation.  See FencingToken.
  FencingToken fence = 6;
}

message CreateVolumeResponse {
  // Path to the backend resource on the storage node.
  string device_path = 1;

  // Actual allocated size in bytes (may be >= requested).
  int64 capacity_bytes = 2;
}

// ImportVolumeRequest asks the agent to adopt an already-existing backend
// storage resource — created by another provisioning stack, e.g.
// democratic-csi or openebs zfs-localpv — into the given volume lifecycle.
// The request carries no creation parameters: the resource is used as-is
// and must already satisfy the requested capacity.
message ImportVolumeRequest {
  // Unique volume identifier within the agent: "<pool>/<volume-name>".  The
  // volume-name resolves to the existing resource through the backend's
  // naming convention (ZFS: "<pool>[/<parent>]/<name>").
  // Example: "hot-data/pvc-abc123"
  string volume_id = 1;

  // Minimum required storage size in bytes.  The existing resource must be
  // at least this large; it is never resized or truncated.
  int64 capacity_bytes = 2;

  // Backend implementation to use.  BACKEND_TYPE_ZFS_ZVOL and
  // BACKEND_TYPE_LVM support import; other backends return UNIMPLEMENTED.
  BackendType backend_type = 3;

  // Fencing token: the PillarVolumeState UID and the publicationGeneration
  // the controller committed for this operation.  See FencingToken.
  FencingToken fence = 4;

  // The full dataset name the caller expects volume_id to resolve to under
  // the agent backend's configured layout (e.g. "hot-data/k8s/pvc-abc123").
  // When set, the agent MUST refuse (FAILED_PRECONDITION) unless its resolved
  // dataset equals this value exactly, before any ownership mark or export:
  // the request carries only pool + leaf, so without it an agent whose
  // parentDataset differs from the controller's would silently adopt a
  // different dataset.  Empty disables the check for older controllers.
  string expected_dataset = 5;

  // The LVM logical volume the caller expects volume_id to resolve to, by
  // name and by stable VG/LV UUIDs.  Required (INVALID_ARGUMENT when unset)
  // iff backend_type is BACKEND_TYPE_LVM, and INVALID_ARGUMENT when set for
  // any other backend.  The agent refuses unless the live LV matches all
  // four fields, and pins the identity into the volume's durable fence mark
  // on first success; a different source for the same volume_id is refused
  // with FAILED_PRECONDITION and the pin is never cleared or retargeted.
  LvmSourceIdentity expected_lvm_source = 6;

  // Adoption policy for an LVM import, pinned into the durable fence mark.
  // Unset means PreserveOriginal (true), so a caller that omits it never
  // gets destructive Managed semantics; only an explicit false opts into
  // Managed.  When preserving, the agent refuses DeleteVolume and
  // ExpandVolume, and ReleaseVolume retires the lifecycle only after
  // verifying no local consumer.  Once pinned true it is never downgraded: a
  // later import with an explicit false is refused with FAILED_PRECONDITION.
  // Ignored for non-LVM imports; ZFS behavior is unaffected.
  optional bool preserve_original = 7;
}

// LvmSourceIdentity names a pre-existing LVM logical volume and its stable
// UUIDs (`lvs -o vg_name,lv_name,vg_uuid,lv_uuid`).
message LvmSourceIdentity {
  string volume_group = 1;
  string logical_volume = 2;
  string volume_group_uuid = 3;
  string logical_volume_uuid = 4;
}

message InspectVolumeRequest {
  // Unique volume identifier within the agent, as in ImportVolumeRequest.
  string volume_id = 1;

  // Backend implementation to inspect.  Only BACKEND_TYPE_LVM is supported.
  BackendType backend_type = 2;
}

// InspectVolumeResponse is an observation, never an ownership claim.
message InspectVolumeResponse {
  // Live LVM observation; unset for non-LVM backends.
  LvmObservation lvm = 1;

  // Filesystem signature type (blkid -p TYPE); set only when
  // filesystem_probe_state is "detected".  Empty never by itself means the
  // device is blank or unformatted.
  string filesystem_type = 2;

  // Filesystem UUID from the same probe; set only with filesystem_type.
  string filesystem_uuid = 3;

  // Local consumers of the device observed on the storage node.  The
  // agent's own exports are reported in exports, not here.
  repeated DeviceConsumer consumers = 4;

  // The agent's durable fence mark for volume_id, read without persisting.
  FenceObservation fence = 5;

  // The agent's own configured exports of volume_id.
  repeated ExportObservation exports = 6;

  // Outcome of the read-only blkid -p signature probe: "detected"
  // (filesystem_type/filesystem_uuid are the reported signature) or
  // "unknown" (blkid exited 2 with no output, which util-linux also returns
  // for a silent low-level read failure; or it reported only a partition
  // table or other TYPE-less records; or the LV is inactive so no probe
  // ran).  "unknown" is never evidence that the device is blank and is not
  // a consumer observation.  A blkid execution failure or malformed output
  // fails the RPC instead.
  string filesystem_probe_state = 7;

  // Why the probe is "unknown" (blkid exit status and output, or why no
  // probe ran); empty when "detected".
  string filesystem_probe_error = 8;

  // Signed recovery snapshot of this exact observation, populated only when
  // the agent holds a signing identity (its server TLS key).  The signature
  // covers the deterministic protobuf encoding of the RecoverySnapshot with
  // the signature field cleared (SHA-256, RSA PKCS#1 v1.5 or ECDSA).  Unset
  // when the agent cannot sign; absence never means the volume is safe to
  // recover.  See RecoverySnapshot and TransferVolumeOwnership.
  RecoverySnapshot snapshot = 9;
}

message LvmObservation {
  // Observed name and UUIDs of the LV.
  LvmSourceIdentity identity = 1;

  // lvs lv_attr.
  string lv_attr = 2;

  // lvs segtype (e.g. "linear", "thin").
  string segtype = 3;

  // lvs pool_lv; empty for non-thin LVs.
  string pool_lv = 4;

  // LV size in bytes.
  int64 size_bytes = 5;

  // Whether the LV is active (lv_attr[4] == 'a').
  bool active = 6;

  // Device path of the LV on the storage node.
  string device_path = 7;

  // Kernel device number "<major>:<minor>"; empty when inactive.
  string dev_major_minor = 8;

  // lvs origin; non-empty for snapshots.
  string origin = 9;

  // Result of one ephemeral O_RDONLY|O_EXCL open (closed immediately, no
  // data read): "free" (open succeeded), "busy" (EBUSY) or "unknown" (any
  // other error, or the LV is inactive).
  string exclusive_claim = 10;
}

// DeviceConsumer is one observed local consumer of the device.
message DeviceConsumer {
  // One of "mount", "holder", "exclusive_open", "foreign_export".
  string kind = 1;

  // Kind-specific detail (mount point, holder device, export path, ...).
  string detail = 2;
}

// ExportObservation is the agent's own configured export of the volume ID.
// It is configuration, not a consumer: no session inventory exists, so it is
// never evidence that the volume is idle or in use.
message ExportObservation {
  string target_id = 1;
  bool namespace_enabled = 2;
  bool acl_enabled = 3;
  repeated string allowed_hosts = 4;
}

// FenceObservation is the agent's durable fence mark for the volume ID.
// volume_uid is the recorded lifecycle, not an ownership claim.
message FenceObservation {
  // Whether a mark exists; all other fields are unset when false.
  bool exists = 1;
  string volume_uid = 2;
  uint64 generation = 3;
  bool ended = 4;
  repeated string ended_uids = 5;

  // Adoption policy pinned by the first successful LVM import.
  bool preserve_original = 6;

  // Source identity pinned by the first successful LVM import; unset for
  // volumes never adopted from an existing LV.
  LvmSourceIdentity lvm_source = 7;
  // Durable identity of the recovery transfer that last changed this mark.
  // A controller may resume a committed transfer after later fencing
  // generations advance only when all of these fields still identify the
  // exact operator authorization and lifecycle endpoints.
  string transfer_authorization_digest = 8;
  string transfer_from_uid = 9;
  uint64 transfer_from_generation = 10;
  string transfer_to_uid = 11;
  uint64 transfer_to_generation = 12;
}

message ImportVolumeResponse {
  // Path to the adopted backend resource on the storage node
  // (e.g. /dev/zvol/hot-data/k8s/pvc-abc123).
  string device_path = 1;

  // Actual size of the existing resource in bytes (>= requested).
  int64 capacity_bytes = 2;
}

// ─────────────────────────────────────────────────────────────────────────────
// DeleteVolume — destroy backend storage resource
// ─────────────────────────────────────────────────────────────────────────────

message DeleteVolumeRequest {
  // Unique volume identifier: "<pool>/<volume-name>".
  string volume_id = 1;

  // Backend type (required for routing to the correct backend plugin).
  BackendType backend_type = 2;

  // Fencing token: the PillarVolumeState UID and the publicationGeneration
  // the controller committed for this operation.  See FencingToken.
  FencingToken fence = 3;
}

message DeleteVolumeResponse {}

// ─────────────────────────────────────────────────────────────────────────────
// ReleaseVolume — end a lifecycle's ownership without touching the backend
// ─────────────────────────────────────────────────────────────────────────────

message ReleaseVolumeRequest {
  // Unique volume identifier: "<pool>/<volume-name>".
  string volume_id = 1;

  // Protocol type of the lifecycle's export to remove, if any.
  ProtocolType protocol_type = 2;

  // Fencing token: the PillarVolumeState UID and the publicationGeneration
  // the controller committed for this operation.  See FencingToken.
  FencingToken fence = 3;
}

message ReleaseVolumeResponse {}

// ─────────────────────────────────────────────────────────────────────────────
// ExpandVolume — resize backend storage resource
// ─────────────────────────────────────────────────────────────────────────────

message ExpandVolumeRequest {
  // Unique volume identifier: "<pool>/<volume-name>".
  string volume_id = 1;

  // Minimum required size in bytes after expansion.
  int64 requested_bytes = 2;

  // Backend type.
  BackendType backend_type = 3;

  // Fencing token: the PillarVolumeState UID and the publicationGeneration
  // the controller committed for this operation.  See FencingToken.
  FencingToken fence = 4;
}

message ExpandVolumeResponse {
  // Actual size in bytes after expansion (>= requested_bytes).
  int64 capacity_bytes = 1;
}

// ─────────────────────────────────────────────────────────────────────────────
// ExportVolume — create protocol target entry (network export)
// ─────────────────────────────────────────────────────────────────────────────

// ExportVolumeRequest asks the agent to expose an already-created volume over
// a network storage protocol.
message ExportVolumeRequest {
  // Volume identifier: "<pool>/<volume-name>".
  string volume_id = 1;

  // Network protocol to use for export.
  ProtocolType protocol_type = 2;

  // Protocol-specific export parameters (bind address, port, etc.).
  ExportParams export_params = 3;

  // Path to the backend resource (from CreateVolumeResponse.device_path or the
  // filesystem mount point for NFS/SMB backends).
  string device_path = 4;

  // Whether ACL-based access control is enabled.
  // If false, any initiator may connect (allow_any_host / generate_node_acls).
  bool acl_enabled = 5;

  // Fencing token: the PillarVolumeState UID and the publicationGeneration
  // the controller committed for this operation.  See FencingToken.
  FencingToken fence = 6;
}

message ExportVolumeResponse {
  // Export information that the controller persists in the PV volumeContext
  // so that pillar-node can connect during NodeStageVolume.
  ExportInfo export_info = 1;
}

// ─────────────────────────────────────────────────────────────────────────────
// UnexportVolume — remove protocol target entry (network export)
// ─────────────────────────────────────────────────────────────────────────────

message UnexportVolumeRequest {
  // Volume identifier: "<pool>/<volume-name>".
  string volume_id = 1;

  // Protocol type of the export to remove.
  ProtocolType protocol_type = 2;

  // Fencing token: the PillarVolumeState UID and the publicationGeneration
  // the controller committed for this operation.  See FencingToken.
  FencingToken fence = 3;
}

message UnexportVolumeResponse {}

// ─────────────────────────────────────────────────────────────────────────────
// SendVolume — stream backend volume data out (backup / cross-node migration)
// ─────────────────────────────────────────────────────────────────────────────

// SendVolumeRequest initiates a volume data send stream.
message SendVolumeRequest {
  // Volume identifier: "<pool>/<volume-name>".
  string volume_id = 1;

  // Backend type (required for routing to the correct backend plugin).
  BackendType backend_type = 2;

  // Optional snapshot name to send from.
  //   ZFS   → snapshot component, e.g. "snap0" → zfs send pool/vol@snap0
  //   LVM   → LV snapshot name
  // If empty the agent sends the current (live) state.  The caller is
  // responsible for quiescing the volume before requesting a live send.
  string snapshot_name = 3;
}

// SendVolumeChunk is one piece of the server-side data stream.
message SendVolumeChunk {
  // Monotonically increasing sequence number starting at 0.
  uint64 sequence = 1;

  // Raw binary payload for this chunk.
  bytes data = 2;

  // Set to true on the last chunk (data may still be non-empty).
  bool eof = 3;

  // Total volume size in bytes.  Populated only in the first chunk
  // (sequence == 0).  May be 0 if the backend cannot determine it in advance
  // (e.g. a compressed zfs-send stream).
  int64 total_bytes = 4;
}

// ─────────────────────────────────────────────────────────────────────────────
// ReceiveVolume — stream data into a backend volume (restore / cross-node migration)
// ─────────────────────────────────────────────────────────────────────────────

// ReceiveVolumeChunk is one piece of the client-side data stream.
// The first chunk (sequence == 0) MUST set volume_id and backend_type; those
// fields are ignored on subsequent chunks.
message ReceiveVolumeChunk {
  // Volume identifier: "<pool>/<volume-name>".
  // Required in the first chunk (sequence == 0).
  string volume_id = 1;

  // Backend type.
  // Required in the first chunk (sequence == 0).
  BackendType backend_type = 2;

  // Monotonically increasing sequence number starting at 0.
  uint64 sequence = 3;

  // Raw binary payload for this chunk.
  bytes data = 4;

  // Set to true on the last chunk (data may still be non-empty).
  bool eof = 5;
}

// ReceiveVolumeResponse is returned by the agent after the full stream has been
// received and written to the backend volume.
message ReceiveVolumeResponse {
  // Total bytes written to the backend volume.
  int64 bytes_written = 1;
}

// ─────────────────────────────────────────────────────────────────────────────
// AllowInitiator — grant access to a specific initiator
// ─────────────────────────────────────────────────────────────────────────────

message AllowInitiatorRequest {
  // Volume identifier: "<pool>/<volume-name>".
  string volume_id = 1;

  // Protocol type of the export.
  ProtocolType protocol_type = 2;

  // Initiator identifier:
  //   NVMe-oF TCP → host NQN (nqn.…)
  //   iSCSI       → IQN (iqn.…)
  //   NFS/SMB     → client IP address or CIDR
  string initiator_id = 3;

  // Fencing token: the PillarVolumeState UID and the publicationGeneration
  // the controller committed for this operation.  See FencingToken.
  FencingToken fence = 4;

  // Protocol parameters the grant needs.  iSCSI applies
  // export_params.iscsi.chap to the new ACL; other protocols ignore it.
  ExportParams export_params = 5;
}

message AllowInitiatorResponse {}

// ─────────────────────────────────────────────────────────────────────────────
// DenyInitiator — revoke access for a specific initiator
// ─────────────────────────────────────────────────────────────────────────────

message DenyInitiatorRequest {
  // Volume identifier: "<pool>/<volume-name>".
  string volume_id = 1;

  // Protocol type of the export.
  ProtocolType protocol_type = 2;

  // Initiator identifier (same semantics as AllowInitiator).
  string initiator_id = 3;

  // Fencing token: the PillarVolumeState UID and the publicationGeneration
  // the controller committed for this operation.  See FencingToken.
  FencingToken fence = 4;
}

message DenyInitiatorResponse {}

// ─────────────────────────────────────────────────────────────────────────────
// SetLocalAttach — fence the network export for a storage-node-local attach
// ─────────────────────────────────────────────────────────────────────────────

message SetLocalAttachRequest {
  // Volume identifier: "<pool>/<volume-name>".
  string volume_id = 1;

  // Protocol type of the export.
  ProtocolType protocol_type = 2;

  // True fences the export for a local attach; false returns it to serving
  // remote initiators.  See AgentService.SetLocalAttach.
  bool local = 3;

  // Fencing token: the PillarVolumeState UID and the publicationGeneration
  // the controller committed for this operation.  See FencingToken.
  FencingToken fence = 4;
}

message SetLocalAttachResponse {
  // Host path of the backend block device (e.g. /dev/zvol/<pool>/<name>)
  // the storage node attaches directly.  Set when local is true.
  string device_path = 1;
}

// ─────────────────────────────────────────────────────────────────────────────
// ReconcileState — push full desired state after agent restart / node reboot
// ─────────────────────────────────────────────────────────────────────────────

// VolumeDesiredState is the complete desired state for a single volume.
message VolumeDesiredState {
  // Volume identifier: "<pool>/<volume-name>".
  string volume_id = 1;

  // Backend type.
  BackendType backend_type = 2;

  // Backend-specific parameters (used to verify / recreate if missing).
  BackendParams backend_params = 3;

  // Path to the backend resource on the storage node.  When empty the agent
  // derives it from the backend that owns volume_id.
  string device_path = 4;

  // Protocol exports that must be active for this volume.
  repeated ExportDesiredState exports = 5;

  // Fencing token: the PillarVolumeState UID and the publicationGeneration
  // the controller committed for this operation.  See FencingToken.
  FencingToken fence = 6;
}

// ExportDesiredState is the desired state for a single export within a volume.
message ExportDesiredState {
  // Protocol type.
  ProtocolType protocol_type = 1;

  // Protocol-specific export parameters.
  ExportParams export_params = 2;

  // Initiators that currently have access (ACL entries to maintain).  When
  // acl_enabled is true this is the exact allowed set: the agent revokes any
  // host not listed here.
  repeated string allowed_initiators = 3;

  // When true, the target admits only allowed_initiators (an empty list
  // admits nobody).  When false, any initiator may connect
  // (attr_allow_any_host=1) and allowed_initiators is ignored.
  bool acl_enabled = 4;

  // When true, the volume is attached directly on the storage node and the
  // export must serve no I/O to any remote initiator (NVMe-oF TCP: the
  // namespace stays disabled).  When false the export serves I/O; the agent
  // never enables an export whose backend device is held exclusively on the
  // storage node and reports that volume as failed instead.
  bool local_attach = 5;
}

message ReconcileStateRequest {
  // Desired state for the volumes to reconcile.  Volumes not in this list are
  // left untouched — the agent MUST NOT delete or modify them; deletion is
  // performed via UnexportVolume / DeleteVolume.
  repeated VolumeDesiredState volumes = 1;
  // True when volumes lists every volume the caller exports from this agent.
  // The agent prepares all of them before linking any to a port and clears
  // HealthCheckResponse.export_restore_pending afterwards, even when some
  // items fail (their results report the failure).
  bool complete = 2;
}

// ReconcileItemResult holds the result for a single volume during reconcile.
message ReconcileItemResult {
  // Volume identifier.
  string volume_id = 1;
  // True if the item was reconciled successfully.
  bool success = 2;
  // Human-readable error message when success == false.
  string error_message = 3;
}

message ReconcileStateResponse {
  // Per-volume reconciliation results.
  repeated ReconcileItemResult results = 1;
  // Timestamp at which the reconcile was completed on the agent.
  google.protobuf.Timestamp reconciled_at = 2;
}

message DrainRequest {}

message DrainResponse {
  // True if a previous Drain call already put the agent into the drained
  // state; the current call had no further effect.  False on the first
  // successful Drain after process start.
  bool was_already_drained = 1;
}

// ─────────────────────────────────────────────────────────────────────────────
// Ownership recovery — signed snapshot + operator authorization
// ─────────────────────────────────────────────────────────────────────────────

// RecoverySnapshot is the agent's signed self-attestation of what it observed
// about a backend volume while healthy.  signature is produced by the agent's
// own server TLS identity key over the deterministic protobuf encoding
// (proto.MarshalOptions{Deterministic: true}) of this message with the
// signature field cleared, using SHA-256 with RSA PKCS#1 v1.5 or ECDSA; other
// key types are rejected.  The snapshot is data, not authority: it is only
// valid when presented together with a RecoveryAuthorization whose
// snapshot_digest matches, and every observation is re-verified live under
// the per-volume lock before a transfer commits.
//
// The snapshot_digest referenced by RecoveryAuthorization is the SHA-256 of
// the deterministic encoding of this message with the signature field
// cleared — the digest of the observation, not of one signature artifact.
message RecoverySnapshot {
  // Unique volume identifier within the agent: "<pool>/<volume-name>".
  string volume_id = 1;

  // Backend implementation the observation describes.  Only
  // BACKEND_TYPE_LVM participates in ownership recovery.
  BackendType backend_type = 2;

  // The adopted LVM logical volume's stable identity as observed.
  LvmSourceIdentity lvm_source = 3;

  // The lifecycle the observation belongs to: the uid and generation the
  // durable fence mark recorded at observe time.  Both MUST equal
  // fence.volume_uid and fence.generation respectively; a signer MUST NOT
  // produce, and a verifier MUST reject, a snapshot where they disagree.
  string old_volume_uid = 4;
  uint64 old_generation = 5;

  // The preserve policy pinned in the fence mark at observe time.
  bool preserve_original = 6;

  // The ephemeral O_RDONLY|O_EXCL claim result at observe time:
  // "free", "busy" or "unknown" (see LvmObservation.exclusive_claim).
  // A transfer requires the live re-check to report "free".
  string exclusive_claim = 7;

  // Local device consumers observed at sign time.  Must be empty for a
  // transferable volume; the agent re-checks live before committing.
  repeated DeviceConsumer consumers = 8;

  // The agent's own configured exports observed at sign time.  A disabled
  // namespace or an enforced empty ACL is stopped evidence and may be
  // present; a transfer requires that no export admits a remote initiator,
  // and the agent re-checks live before committing.
  repeated ExportObservation exports = 9;

  // The durable fence mark read at observe time.
  FenceObservation fence = 10;

  // Identity of the signing agent: the Subject Common Name (or first DNS
  // SAN) of the server TLS certificate that produced signature.  A verifier
  // checking against a certificate MUST require this to match.
  string agent_identity = 11;

  // Time the snapshot was signed.  Bounded freshness applies on verify;
  // stale or future-dated snapshots are rejected.
  google.protobuf.Timestamp issued_at = 12;

  // Signature over the deterministic encoding of this message with this
  // field cleared.  See the message comment for the exact scheme.
  bytes signature = 13;
}

// RecoveryAuthorization is the operator's signed grant to transfer one
// specific volume's ownership to one specific new lifecycle.  signature is
// produced by an operator-held private key (the configured
// --recovery-trust-anchor file holds the corresponding public keys) over the
// deterministic protobuf encoding of this message with the signature field
// cleared, using the same digest and signature schemes as RecoverySnapshot.
//
// The authorization_digest recorded in the transferred fence mark and in
// PillarVolumeState.spec.recovery.authorizationDigest is the SHA-256 of the
// deterministic encoding of this message with the signature field cleared.
message RecoveryAuthorization {
  // SHA-256 digest of the presented RecoverySnapshot's deterministic
  // encoding with its signature field cleared.  Binds this grant to exactly
  // one observation; a different or re-signed-but-modified snapshot does
  // not match.
  bytes snapshot_digest = 1;

  // The volume the grant applies to.  volume_id, backend_type, lvm_source,
  // old_volume_uid and old_generation MUST equal the corresponding
  // RecoverySnapshot fields exactly; any mismatch refuses the transfer.
  string volume_id = 2;
  BackendType backend_type = 3;
  LvmSourceIdentity lvm_source = 4;
  string old_volume_uid = 5;

  // The old lifecycle's exact generation.  Exact equality required: a newer
  // or older generation on the live mark refuses the transfer.
  uint64 old_generation = 6;

  // Destination lifecycle: the PillarVolumeState UID (the recovery
  // PillarVolumeState's metadata.uid, created in phase RecoveryPending) and
  // the generation written into the transferred mark.
  string new_volume_uid = 7;
  uint64 new_generation = 8;

  // The preserve policy the transferred lifecycle adopts.  Explicit
  // presence required: an unset field is INVALID_ARGUMENT, mirroring
  // ImportVolumeRequest.preserve_original (unset never yields destructive
  // Managed semantics silently — here it yields refusal).
  optional bool preserve_original = 9;

  // Validity window.  A transfer presented before issued_at (beyond clock
  // skew) or after expires_at is refused; the window length is bounded.
  google.protobuf.Timestamp issued_at = 10;
  google.protobuf.Timestamp expires_at = 11;

  // Operator signature over the deterministic encoding of this message
  // with this field cleared.
  bytes signature = 12;
}

// TransferVolumeOwnershipRequest carries the full proof for one transfer:
// the agent-signed observation and the operator-signed grant bound to it.
// No FencingToken field exists — the authorization is the authority.
message TransferVolumeOwnershipRequest {
  RecoverySnapshot snapshot = 1;
  RecoveryAuthorization authorization = 2;
}

// TransferOutcome reports what happened to the atomic mark write.
enum TransferOutcome {
  TRANSFER_OUTCOME_UNSPECIFIED = 0;

  // The mark write committed: rename + fsync confirmed.  The new lifecycle
  // owns the volume ID.
  TRANSFER_OUTCOME_COMMITTED = 1;

  // An identical transfer (same snapshot digest, same authorization digest,
  // same destination uid/generation) was already committed; this call was
  // an idempotent retry.
  TRANSFER_OUTCOME_ALREADY_COMMITTED = 2;

  // The outcome of the mark write is uncertain (failure after or during the
  // atomic rename/fsync).  The agent performed NO rollback and the mark may
  // or may not have committed; the caller must re-inspect.  The operation
  // remains idempotent for the exact same request.
  TRANSFER_OUTCOME_UNKNOWN = 3;
}

message TransferVolumeOwnershipResponse {
  TransferOutcome outcome = 1;

  // SHA-256 digest of the committed RecoveryAuthorization's deterministic
  // encoding with its signature field cleared.  Echoed so the controller can
  // record exactly which grant committed.
  bytes authorization_digest = 2;
}
